# Patch docker-compose.yaml to add additional contexts and args
# Use the following command to patch the docker-compose.yaml file:
#    docker compose -f docker-compose.patch.yaml build

services:
  bundler-service:
    build:
      context: .
      target: service
      dockerfile: Dockerfile.uv
      additional_contexts: 
        server_api: ../bundler_app_server_gen
        # server_logic: ../bundler_app
        bundler_app: ../bundler_app
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.10}
      platforms:
        - "linux/amd64"
    image: ${REGISTRY_IMAGE}/bundler-service:${COMMIT_SHORT_DATE} # Timestamp in format 'YYYYMMDD-HHMM'
    platform: linux/amd64
    ports:
      - "8100:8080"
    command: uvicorn openapi_server.main:app --host 0.0.0.0 --port 8080
