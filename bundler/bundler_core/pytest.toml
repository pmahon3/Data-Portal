# Pytest configuration (pytest 9+). Takes precedence over pyproject.toml.
# https://docs.pytest.org/en/stable/reference/customize.html#pytest-toml

[pytest]
minversion = "9.0"
pythonpath = ["bundler_core/src"]
# Pass --cov=<importable package> on the pytest command (``bundler_core``, not a hyphenated distribution name).
# ``--cov-append`` merges into ``.coverage`` when multiple pytest runs share this directory.
addopts = ["--cov-append", "--cov-report=term-missing"]
