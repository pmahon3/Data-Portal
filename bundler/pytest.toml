# Pytest configuration (pytest 9+). Takes precedence over pyproject.toml.
# https://docs.pytest.org/en/stable/reference/customize.html#pytest-toml

[pytest]
minversion = "9.0"
# Terminal coverage table. Pass --cov=... on the pytest command.
# Cobertura XML and JUnit stay on the CI command.
addopts = ["--ignore=tests/test_default_api.py", "--cov-report=term-missing"]
