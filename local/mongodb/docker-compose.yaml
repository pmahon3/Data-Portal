
services:
  mongodb:
    # Pinned to 7.0: mongo:latest and 8.0 refuse to start on Linux kernel 6.19+
    # (Docker Desktop's VM ships 7.x), failing with SERVER-121912. Revert to
    # :latest once upstream ships a fix.
    image: mongo:${MONGO_IMAGE_TAG:-7.0}
    attach: false
    # container_name: mongodb
    ports:
      - "27017:27017"
#      - "27017-27019:27017-27019"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - data-mongodb:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - ams-network

  mongo-express:
    image: mongo-express
    # container_name: mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=${ME_CONFIG_MONGODB_URL:-mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/?authSource=admin}
      # MongoExpress web auth
      - ME_CONFIG_BASICAUTH_USERNAME=${ME_CONFIG_BASICAUTH_USERNAME:-admin}
      - ME_CONFIG_BASICAUTH_PASSWORD=${ME_CONFIG_BASICAUTH_PASSWORD:-admin123}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ams-network


networks:
  ams-network:
    driver: bridge

volumes:
  data-mongodb:
