
services:
  mongodb:
    image: mongo:8.0
    attach: false
    # container_name: mongodb
    ports:
      - "27017:27017"
#      - "27017-27019:27017-27019"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      # Workaround for SERVER-121912: MongoDB refuses to start on Linux kernels
      # 6.19 through 7.0.13 (Docker Desktop's VM is 7.0.12-linuxkit). Remove once
      # the VM kernel reaches 7.0.14+.
      - GLIBC_TUNABLES=glibc.pthread.rseq=1
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - data-mongodb:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - ams-network

  mongo-express:
    image: mongo-express
    # container_name: mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=${ME_CONFIG_MONGODB_URL:-mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/?authSource=admin}
      # MongoExpress web auth
      - ME_CONFIG_BASICAUTH_USERNAME=${ME_CONFIG_BASICAUTH_USERNAME:-admin}
      - ME_CONFIG_BASICAUTH_PASSWORD=${ME_CONFIG_BASICAUTH_PASSWORD:-admin123}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ams-network


networks:
  ams-network:
    driver: bridge

volumes:
  data-mongodb:
