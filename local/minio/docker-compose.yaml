
services:
  minio:
    image: quay.io/minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - data-minio:/data
      # - ./data:/data
    networks:
      - ams-network
    command: server /data --console-address ":9001"

networks:
  ams-network:
    driver: bridge

volumes:
  data-minio:
