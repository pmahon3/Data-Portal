
services:
  postgres:
    image: postgres:${POSTGRES_MAJOR:-18}
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PGDATA=/var/lib/postgresql/data/${POSTGRES_MAJOR:-18}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - ../../backend/core/db/postgres/scripts/schema.sql:/docker-entrypoint-initdb.d/10-backend-schema.sql:ro
      # - data-postgres-13:/var/lib/postgresql/data
      # The key difference from previous versions is that the data volume should be mounted to /var/lib/postgresql instead of /var/lib/postgresql/data. 
      # This allows the image to manage version-specific subdirectories internally
      # /var/lib/postgresql/data/<MAJOR-NUMBER>/{backups,data,initdb.log}
      - data-postgres:/var/lib/postgresql
    networks:
      - ams-network

networks:
  ams-network:
    driver: bridge

volumes:
  data-postgres:
