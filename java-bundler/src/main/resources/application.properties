spring.application.name=bundler
server.port=8888

################## Temp directory to store generated zip files
bundler.archive.temp="~/Desktop"

# Archive strategy for timing comparisons:
# current   = concurrent downloads to staging, then one sequential ZIP pass
# batch     = old fixed-size batch download comparison
# streaming = direct download-to-ZIP comparison
 #hybrid    = bounded concurrent download prefetch feeding one ZIP writer
bundler.archive.strategy=hybrid
#bundler.archive.strategy=current

############ Thread Pool Configuration
bundler.worker.threads=5
bundler.worker.queue-capacity=100


## Download Thread pool
# total size of all bundles can download files
bundler.download.threads=8

# one bundle should not eat up all file download capacity; at most 4 at once
bundler.download.parallelism=4


################### bundler http requests properties
bundler.download.connect-timeout-seconds=5
bundler.download.request-timeout-seconds=60
bundler.download.max-attempts=3
bundler.download.retry-delay-millis=500
