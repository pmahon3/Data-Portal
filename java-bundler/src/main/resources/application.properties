spring.application.name=bundler
server.port=8888

################## Temp directory to store generated zip files
# BUNDLER_ARCHIVE_TEMP_DIR controls where generated ZIP files are written locally.
bundler.archive.temp-dir=${BUNDLER_ARCHIVE_TEMP_DIR:${java.io.tmpdir}}
################## Job metadata store
# Java bundler persists bundle job metadata through Spring Data JPA.
# ZIP bytes are not stored in the database.
# BUNDLER_JOBS_POSTGRES_JDBC_URL points the job metadata store to PostgreSQL.
spring.datasource.url=${BUNDLER_JOBS_POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/inn_bundler}
# BUNDLER_JOBS_POSTGRES_USERNAME is the PostgreSQL username for job metadata.
spring.datasource.username=${BUNDLER_JOBS_POSTGRES_USERNAME:postgres}
# BUNDLER_JOBS_POSTGRES_PASSWORD is the PostgreSQL password for job metadata.
spring.datasource.password=${BUNDLER_JOBS_POSTGRES_PASSWORD:}
# BUNDLER_JOBS_SCHEMA_MODE controls Hibernate schema management; keep none when schema.sql owns DDL.
spring.jpa.hibernate.ddl-auto=${BUNDLER_JOBS_SCHEMA_MODE:none}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=always
# BUNDLER_INSTANCE_ID identifies this worker in DB job locks; Nomad allocation or hostname is used as fallback.
bundler.instance-id=${BUNDLER_INSTANCE_ID:${NOMAD_ALLOC_ID:${HOSTNAME:}}}
# BUNDLER_JOB_LOCK_DURATION_SECONDS controls how long a worker owns a claimed job before another instance can retry it.
bundler.job.lock-duration-seconds=${BUNDLER_JOB_LOCK_DURATION_SECONDS:600}
# BUNDLER_JOB_CLAIM_SCAN_ENABLED enables scanning PostgreSQL for pending or expired jobs.
bundler.job.claim-scan-enabled=${BUNDLER_JOB_CLAIM_SCAN_ENABLED:true}
# BUNDLER_JOB_CLAIM_SCAN_DELAY_MILLIS controls delay between claim-scan runs.
bundler.job.claim-scan-delay-millis=${BUNDLER_JOB_CLAIM_SCAN_DELAY_MILLIS:5000}
# BUNDLER_JOB_CLAIM_SCAN_BATCH_SIZE limits how many claimable jobs each scan queues.
bundler.job.claim-scan-batch-size=${BUNDLER_JOB_CLAIM_SCAN_BATCH_SIZE:20}
# BUNDLER_JOB_RETENTION_ENABLED enables cleanup of old completed or failed bundle jobs.
bundler.job.retention-enabled=${BUNDLER_JOB_RETENTION_ENABLED:true}
# BUNDLER_JOB_COMPLETED_RETENTION_HOURS controls how long terminal jobs and archives are retained.
bundler.job.completed-retention-hours=${BUNDLER_JOB_COMPLETED_RETENTION_HOURS:168}
# BUNDLER_JOB_RETENTION_INITIAL_DELAY_MILLIS controls delay before the first retention cleanup run.
bundler.job.retention-initial-delay-millis=${BUNDLER_JOB_RETENTION_INITIAL_DELAY_MILLIS:60000}
# BUNDLER_JOB_RETENTION_SCAN_DELAY_MILLIS controls delay between retention cleanup runs.
bundler.job.retention-scan-delay-millis=${BUNDLER_JOB_RETENTION_SCAN_DELAY_MILLIS:3600000}
# BUNDLER_JOB_RETENTION_BATCH_SIZE limits how many terminal jobs each retention run deletes.
bundler.job.retention-batch-size=${BUNDLER_JOB_RETENTION_BATCH_SIZE:100}
# BUNDLER_OUTPUT_OBJECT_STORAGE_ENDPOINT sets the S3-compatible endpoint for uploaded bundles.
bundler.output.object-storage.endpoint=${BUNDLER_OUTPUT_OBJECT_STORAGE_ENDPOINT:}
# BUNDLER_OUTPUT_OBJECT_STORAGE_REGION sets the S3 region used by the SDK.
bundler.output.object-storage.region=${BUNDLER_OUTPUT_OBJECT_STORAGE_REGION:us-east-1}
# BUNDLER_OUTPUT_OBJECT_STORAGE_BUCKET selects the bucket where completed bundle ZIPs are uploaded.
bundler.output.object-storage.bucket=${BUNDLER_OUTPUT_OBJECT_STORAGE_BUCKET:}
# BUNDLER_OUTPUT_OBJECT_STORAGE_KEY_PREFIX sets the object key folder/prefix for uploaded bundle ZIPs.
bundler.output.object-storage.key-prefix=${BUNDLER_OUTPUT_OBJECT_STORAGE_KEY_PREFIX:bundles}
# BUNDLER_OUTPUT_OBJECT_STORAGE_ACCESS_KEY_ID is the access key for uploading and presigning bundle ZIPs.
bundler.output.object-storage.access-key-id=${BUNDLER_OUTPUT_OBJECT_STORAGE_ACCESS_KEY_ID:}
# BUNDLER_OUTPUT_OBJECT_STORAGE_SECRET_ACCESS_KEY is the secret key for uploading and presigning bundle ZIPs.
bundler.output.object-storage.secret-access-key=${BUNDLER_OUTPUT_OBJECT_STORAGE_SECRET_ACCESS_KEY:}
# BUNDLER_OUTPUT_OBJECT_STORAGE_PATH_STYLE_ACCESS controls S3 URL style:
# true puts bucket in the path, like http://host/bucket/key; false puts bucket in the hostname.
bundler.output.object-storage.path-style-access=${BUNDLER_OUTPUT_OBJECT_STORAGE_PATH_STYLE_ACCESS:true}
# BUNDLER_OUTPUT_OBJECT_STORAGE_PRESIGNED_URL_EXPIRATION_SECONDS controls how long returned bundle URLs stay valid.
bundler.output.object-storage.presigned-url-expiration-seconds=${BUNDLER_OUTPUT_OBJECT_STORAGE_PRESIGNED_URL_EXPIRATION_SECONDS:3600}

# Archive strategy for timing comparisons:
# current   = concurrent downloads to staging, then one sequential ZIP pass
# batch     = old fixed-size batch download comparison
# streaming = direct download-to-ZIP comparison
# hybrid    = bounded concurrent download prefetch feeding one ZIP writer
# BUNDLER_ARCHIVE_STRATEGY selects the ZIP build strategy.
bundler.archive.strategy=${BUNDLER_ARCHIVE_STRATEGY:hybrid}

############ Thread Pool Configuration
# BUNDLER_WORKER_THREADS controls how many bundle jobs this instance can process at once.
bundler.worker.threads=${BUNDLER_WORKER_THREADS:5}
# BUNDLER_WORKER_QUEUE_CAPACITY controls how many submitted jobs can wait in this instance's local queue.
bundler.worker.queue-capacity=${BUNDLER_WORKER_QUEUE_CAPACITY:100}


## Download Thread pool
# total size of all bundles can download files
# BUNDLER_DOWNLOAD_THREADS controls the global file-download thread pool size.
bundler.download.threads=${BUNDLER_DOWNLOAD_THREADS:8}

# one bundle should not eat up all file download capacity; at most 4 at once
# BUNDLER_DOWNLOAD_PARALLELISM limits concurrent file downloads per bundle job.
bundler.download.parallelism=${BUNDLER_DOWNLOAD_PARALLELISM:4}


################### bundler http requests properties
# BUNDLER_DOWNLOAD_CONNECT_TIMEOUT_SECONDS controls HTTP connection timeout when downloading source files.
bundler.download.connect-timeout-seconds=${BUNDLER_DOWNLOAD_CONNECT_TIMEOUT_SECONDS:5}
# BUNDLER_DOWNLOAD_REQUEST_TIMEOUT_SECONDS controls total HTTP request timeout when downloading source files.
bundler.download.request-timeout-seconds=${BUNDLER_DOWNLOAD_REQUEST_TIMEOUT_SECONDS:60}
# BUNDLER_DOWNLOAD_MAX_ATTEMPTS controls retry count for failed source-file downloads.
bundler.download.max-attempts=${BUNDLER_DOWNLOAD_MAX_ATTEMPTS:3}
# BUNDLER_DOWNLOAD_RETRY_DELAY_MILLIS controls wait time between source-file download retries.
bundler.download.retry-delay-millis=${BUNDLER_DOWNLOAD_RETRY_DELAY_MILLIS:500}
