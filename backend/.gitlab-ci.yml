
# Use native Auto DevOps jobs (Auto Build/Test/Security/Deploy)
include:
  # - template: Auto-DevOps.gitlab-ci.yml
  - local: '/.gitlab/Auto-DevOps.gitlab-ci.yml' # local copy of the Auto DevOps template for customizations
  - local: '/.gitlab/ci/ruff.yml'    # Ruff code quality check from common local library.
  - local: '/.gitlab/ci/retag.yml'   # Retag job template
  - local: '/.gitlab/deploy/Deploy.nomad.gitlab-ci.yml'  # Nomad deployment integration with Auto DevOps
  
# # Route jobs to the runner that mounts /var/run/docker.sock
# default:
#   tags:
#     - inn-runner-docker   # <-- tag of your Docker-capable runner

# Tell Auto DevOps to build from backend/
variables:
  DOCKERFILE_PATH: backend/Dockerfile
  AUTO_DEVOPS_BUILD_IMAGE_CONTEXT: backend
  # Override Auto DevOps default repository to use service-specific name
  CI_APPLICATION_REPOSITORY: ${CI_REGISTRY_IMAGE}/backend
  CI_APPLICATION_TAG: ${CI_COMMIT_SHA}
  
  # TEST 2 (restored): Enable inline cache with BuildKit (attestations disabled)
  # TEST 3 failed: attestations/provenance caused 0-byte tags / missing manifest digest
  # See: .gitlab/BUILDKIT-TESTING-PLAN.md
  # Use BuildKit for faster builds + better layer caching in CI (works with our runner Docker cache)
  DOCKER_BUILDKIT: "1"
  # Enable inline cache so the pushed image can be used as --cache-from in later builds
  DOCKER_BUILDKIT_INLINE_CACHE: "1"
  BUILDKIT_PROGRESS: "plain"
  # "1" means true/enabled: disables BuildKit's default provenance/attestations to avoid GitLab 18.6 registry creating 0-byte/invalid tags
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
  
  # Enable inline cache in images for future cache sources
  # Note: Without BuildKit, inline cache won't work, but regular Docker cache will
  # Local runner cache is used automatically by Docker if configured
  # See docs/gitlab-runner-local-cache-config.md for runner configuration
  
  # Add build arguments and a build-time tag
  # Auto DevOps handles the primary tag via CI_APPLICATION_REPOSITORY/CI_APPLICATION_TAG
  # The 'ci' tag is added here to exercise multiple tags at build time
  AUTO_DEVOPS_BUILD_IMAGE_EXTRA_ARGS: >
    --tag ${CI_REGISTRY_IMAGE}/backend:ci
    --build-arg BUILDKIT_INLINE_CACHE=1
    --label org.opencontainers.image.version=${PIPELINE_TIMESTAMP}
    --label org.opencontainers.image.created=${CI_COMMIT_TIMESTAMP}
    --label org.opencontainers.image.revision=${CI_COMMIT_SHA}
    --label org.opencontainers.image.source=${CI_PROJECT_URL}
    --label org.opencontainers.image.title=${CI_PROJECT_NAME}
    --label org.opencontainers.image.description=${CI_PROJECT_NAME}
    --label org.opencontainers.image.url=${CI_PROJECT_URL}
    --label org.opencontainers.image.ref.name=${CI_COMMIT_REF_NAME}
    --label org.opencontainers.image.authors=${GITLAB_USER_NAME:-${CI_COMMIT_AUTHOR}}

  # Nomad deployment configuration
  SERVICE_NAME: "backend"
  HEALTH_BASE: "api"
  NOMAD_DEPLOY_ENABLED: "${NOMAD_DEPLOY_ENABLED}"
  # NOMAD_EXTERNAL_ACCESS not set - uses defaults:
  #   - Review Apps: external access enabled (for testing)
  #   - Production/Staging/Development: internal only (service discovery)
  
  # Enable staging deployment (requires manual promotion to production)
  # When enabled: staging deploys automatically, production requires manual promotion
  STAGING_ENABLED: "${STAGING_ENABLED}"
  
  # Disable Auto DevOps Kubernetes deployment (we use Nomad instead)
  # This prevents Auto DevOps from trying to deploy to Kubernetes
  DEPLOY_DISABLED: "${DEPLOY_DISABLED}"
  # Explicitly disable Auto DevOps review jobs to prevent job name conflicts
  # REVIEW_DISABLED: "true"
  
# Override Auto DevOps test job for backend monorepo layout (we have separate test jobs for backend and frontend)
# If necessary, disable Auto DevOps test via CI variable: TEST_DISABLED: "true"
test:
  stage: test
  image: python:3.12
  before_script:
    - cd backend
    - pip install -r requirements.txt
  script:
    - pytest -q --junit-xml=backend-test-report.xml || echo "Tests failed or not detected by Auto DevOps"
  artifacts:
    reports:
      junit: backend/backend-test-report.xml
    paths:
      - backend-test-report.xml
      - backend/backend-test-report.xml
    when: always

code_quality_ruff_check:
  extends: .ruff-check-template
  variables:
    RUFF_TARGET: backend
    RUFF_REPORT: backend-code-quality-report.json

# Post-build: add timestamp tag and branch-specific 'latest' tags
# Backend-specific retag job - runs only when backend files change
retag-backend:
  extends: .retag_job_base
  variables:
    SERVICE_CHANGED: "backend"
  rules:
    - changes:
        - backend/**/*
      when: on_success
    - when: always   # <— temporary "override/fallback" so this job still runs
