
secrets:
  kc_admin_client_secret:
    environment: KEYCLOAK_ADMIN_CLIENT_SECRET

services:
  backend:
    container_name: ams-backend
    build: 
      context: .
      platforms:
        - "linux/amd64"
    depends_on:
    # Require backend dependencies to be ready before startup tasks run
      keycloak:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      java-bundler:
        condition: service_healthy
    # entrypoint: ["bash", "/app/entrypoint.backend.sh"]
    environment:
      # Keycloak connection (external instance on separate domain)
      KEYCLOAK_DOMAIN: http://keycloak:8080
      KEYCLOAK_REALM: ams-portal
      KEYCLOAK_UI_CLIENT_ID: ams-portal-ui
      KEYCLOAK_ADMIN_CLIENT_ID: ams-portal-admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KEYCLOAK_ADMIN_CLIENT_SECRET_FILE: /run/secrets/kc_admin_client_secret
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      # Token issuer must match the URL in JWT tokens (frontend accesses via localhost)
      KEYCLOAK_TOKEN_ISSUER: http://localhost:8080/realms/ams-portal
      # External issuer for smoke tests (how tokens are actually issued)
      KEYCLOAK_EXTERNAL_ISSUER: http://localhost:8080/realms/ams-portal

      # App/runtime config
      AMS_HOST: 0.0.0.0
      AMS_PORT: "8000"
      AMS_RELOAD: "false"
      SYSTEM_RESET: "false"
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-JzATRY8v4ztexRVDLlqpaOBm8AfGvwwtC2NU47diyE0=}
      LOG_LEVEL: INFO
      LOG_DIR: /app/data/logs
      API_VERSION: "0_1"

      # Casbin/data paths
      ENFORCER_MODEL: /app/core/services/policies/casbin/model.conf
      ENFORCER_POLICY: /app/core/services/policies/casbin/policy.csv
      INSTANCE_CONFIGS: /app/data/configs

      # Backend base URL
      BACKEND_BASE_URL: http://localhost:8000

      # Database connections
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-objtree_app}:${POSTGRES_PASSWORD:-1q2w3e4r}@postgres:5432/${POSTGRES_DB:-inn_objtree}
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_INIT_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INIT_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-1q2w3e4r}
      MONGO_DB: ${MONGO_DB:-inn_mongo}

      # Bundler provider switch: set BUNDLER_PROVIDER to "python" or "java"
      BUNDLER_PROVIDER: ${BUNDLER_PROVIDER:-java}
      PYTHON_BUNDLER_URL: ${PYTHON_BUNDLER_URL:-http://bundler:8082}
      JAVA_BUNDLER_URL: ${JAVA_BUNDLER_URL:-http://java-bundler:8888}

      # Control smoke test execution on startup (default: true)
      RUN_SMOKE_TESTS: "true"

    ports:
      - "8000:8000"
    networks:
      - ams-network  # Shared network for backend and other services

    # extra_hosts:
    #   # Keycloak uses host-gateway as it's external to the AMS network
    #   - "keycloak.local:host-gateway"

    volumes:
      - .:/app
      - ./data/logs:/app/data/logs
      - ./data/policies:/app/data/policies
      - ./data/configs:/app/data/configs
    secrets:
      - kc_admin_client_secret
    working_dir: /app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ams-network:
    # Shared network enables Docker DNS-based service discovery
    # Services can reach each other using service names
    # external: true
    driver: bridge
