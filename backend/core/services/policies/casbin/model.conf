[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
# Policy paths are literal: "bucket/path/file.txt" names one file, "bucket/folder/*" a folder and
# everything in it, "*" everything on the instance. Any other "*" is part of a name, and no character is
# a regular expression. Upper and lower case differ.
#
# 1. User and storage instance must match exactly.
# 2. A request path with a ".." segment matches nothing, so it can't climb out of a granted folder.
# 3. The policy is the requested path, or "*", or a folder ("bucket/folder/*", its only "*") holding
#    the requested path; or the request is a folder ("bucket/folder/") on the way to something the
#    policy covers, so the folders above a granted file can be browsed.
#    Example: Policy="bucket/folder/file.txt", Request="bucket/folder/" -> MATCH
#    Example: Policy="bucket/folder/file.txt", Request="bucket/folder/file.txt.bak" -> NO MATCH
#    Example: Policy="bucket/study*", Request="bucket/study-old/x.txt" -> NO MATCH
# 4. The requested action is the policy's action, or the policy's action is "*".
m = r.sub == p.sub && r.dom == p.dom && \
    !regexMatch(r.obj, ".*(^|/)[.][.](/|$)") && \
    (r.obj == p.obj || p.obj == "*" || \
     (regexMatch(p.obj, "^[^*]*/[*]$") && keyMatch(r.obj, p.obj)) || \
     (regexMatch(r.obj, "^[^*]*/$") && keyMatch(p.obj, r.obj + "*"))) && \
    (r.act == p.act || p.act == "*")
