[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
# Policy paths are literal (INN-297): "bucket/path/file.txt" names one file, "bucket/folder/*" a
# folder and everything in it, "*" everything on the instance. No character is a regular expression.
#
# 1. User and storage instance must match exactly.
# 2. The policy covers the requested path (keyMatch), or the request is a folder ("bucket/folder/")
#    on the way to something the policy covers, so the folders above a granted file can be browsed.
#    Example: Policy="bucket/folder/file.txt", Request="bucket/folder/" -> MATCH
#    Example: Policy="bucket/folder/file.txt", Request="bucket/folder/file.txt.bak" -> NO MATCH
# 3. The requested action must match the policy's action.
m = r.sub == p.sub && r.dom == p.dom && \
    (keyMatch(r.obj, p.obj) || (regexMatch(r.obj, ".*/$") && keyMatch(p.obj, r.obj + "*"))) && \
    regexMatch(r.act, p.act)
