[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
# 1. User and Domain must match exactly
#
# 2. Resource Check:
#
# We want to match if:
# A) The user has a policy that covers the requested resource exactly (or via wildcard).
#    Example: Policy="bucket/folder/.*", Request="bucket/folder/file.txt" -> MATCH
#
# B) The user is requesting a parent folder, and they have permission to SOMETHING inside it.
#    This allows listing a folder if you own a file deep inside it.
#    Example: Policy="bucket/folder/file.txt", Request="bucket/folder/" -> MATCH
#    Example: Policy="bucket/folder/file.txt", Request="bucket/folder/subfolder/" -> NO MATCH
#
# 3. The requested action must match the policy via regex
m = r.sub == p.sub && r.dom == p.dom && \
    (regexMatch(r.obj, p.obj) || regexMatch(p.obj, r.obj + ".*")) && \
    regexMatch(r.act, p.act)