[request_definition]
r = sub, dom, obj, act

[policy_definition]
# cond: the policy's conditions as JSON, e.g. {"ends": "2027-06-30"}; empty for none. Only
# core/services/policies/rules.py reads it. Declaring it makes enforce() refuse to run on these
# rows rather than ignore an end date, and nothing calls enforce() (tests/test_access_rules.py).
p = sub, dom, obj, act, cond

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
# Casbin stores and manages policies; permission decisions are made by
# core/services/policies/rules.py. This matcher is not used and ignores cond.
#
# 1. User and storage instance must match exactly.
# 2. The policy path covers the requested path (keyMatch, literal):
#      "bucket/path/file.txt"  exactly that file
#      "bucket/folder/*"       that folder and everything in it
#      "*"                     everything on the instance
# 3. The action matches exactly, or the policy's action is "*".
m = r.sub == p.sub && r.dom == p.dom && \
    keyMatch(r.obj, p.obj) && \
    (r.act == p.act || p.act == "*")
