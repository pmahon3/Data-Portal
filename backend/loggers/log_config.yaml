version: 1
disable_existing_loggers: false

formatters:
  simple:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  detailed:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(filename)s - %(funcName)s - %(lineno)d - %(message)s'
  component:
    format: '%(asctime)s - [%(name)s] - %(levelname)s - %(funcName)s:%(lineno)d - %(message)s'

handlers:
  console:
    class: logging.StreamHandler
    stream: ext://sys.stdout
    formatter: simple
  app_file:
    class: logging.FileHandler
    filename: ${LOG_DIR}/app.log
    mode: a
    formatter: detailed
  user_manager_file:
    class: logging.FileHandler
    filename: ${LOG_DIR}/user-manager.log
    mode: a
    formatter: component
  instance_manager_file:
    class: logging.FileHandler
    filename: ${LOG_DIR}/instance-manager.log
    mode: a
    formatter: component
  policy_manager_file:
    class: logging.FileHandler
    filename: ${LOG_DIR}/policy-manager.log
    mode: a
    formatter: component
  storage_file:
    class: logging.FileHandler
    filename: ${LOG_DIR}/storage.log
    mode: a
    formatter: component
  uvicorn_file:
    class: logging.FileHandler
    filename: ${LOG_DIR}/uvicorn.log
    mode: a
    formatter: detailed
  error_file:
    class: logging.FileHandler
    filename: ${LOG_DIR}/errors.log
    mode: a
    level: ERROR
    formatter: detailed

loggers:
  # Application-level loggers
  app:
    level: ${LOG_LEVEL}
    handlers: [console, app_file]
    propagate: false

  # Management component loggers
  user-manager:
    level: ${LOG_LEVEL}
    handlers: [console, user_manager_file]
    propagate: false
  instance-manager:
    level: ${LOG_LEVEL}
    handlers: [console, instance_manager_file]
    propagate: false
  policy-manager:
    level: ${LOG_LEVEL}
    handlers: [console, policy_manager_file]
    propagate: false

  # Storage-specific loggers
  storage.s3:
    level: ${LOG_LEVEL}
    handlers: [console, storage_file]
    propagate: false
  storage.dummy:
    level: ${LOG_LEVEL}
    handlers: [console, storage_file]
    propagate: false

  # Server loggers
  uvicorn:
    level: ${LOG_LEVEL}
    handlers: [console, uvicorn_file]
    propagate: false
  uvicorn.error:
    level: ${LOG_LEVEL}
    handlers: [console, uvicorn_file]
    propagate: false
  uvicorn.access:
    level: INFO
    handlers: [console, uvicorn_file]
    propagate: false

  # Legacy casbin logger (will be replaced by policy-manager)
  casbin:
    level: ${LOG_LEVEL}
    handlers: [console, policy_manager_file]
    propagate: false

  # API endpoint error logger
  api.endpoints:
    level: ${LOG_LEVEL}
    handlers: [console, app_file, error_file]
    propagate: false

root:
  level: ${LOG_LEVEL}
  handlers: [console]
