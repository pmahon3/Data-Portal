<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body { margin: 0; } [hidden] { display: none !important; }</style>
<title>INN Decision Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one horizontal band per level, strategy at the top and code at the bottom; a reading panel beside it. */
:root {
  --bg: #f4f5f1;
  --panel: #fbfbf8;
  --ink: #1b2422;
  --muted: #5f6b67;
  --rule: #d9ddd6;
  --accent: #0d6b66;
  --accent-soft: #cfe5e1;
  --open: #b4691c;
  --edge: #8a958f;
  --band: #eceee8;
  --fail: #b3261e;
  --display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111615; --panel: #171d1c; --ink: #e2e8e5; --muted: #95a29d; --rule: #2a3331;
    --accent: #5ec4b9; --accent-soft: #1d3a37; --open: #e0a44e; --edge: #6d7a75; --band: #151b1a; --fail: #f08a7e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111615; --panel: #171d1c; --ink: #e2e8e5; --muted: #95a29d; --rule: #2a3331;
  --accent: #5ec4b9; --accent-soft: #1d3a37; --open: #e0a44e; --edge: #6d7a75; --band: #151b1a; --fail: #f08a7e;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--display); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px;
  box-sizing: border-box;
}
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; margin-bottom: 14px; }
h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 62ch; line-height: 1.45; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
input[type="search"] {
  font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--rule);
  border-radius: 6px; padding: 7px 10px; width: 15rem; max-width: 100%;
}
input[type="search"]:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.owner-groups { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-bottom: 12px; }
.owner-groups .eyebrow { margin-right: 2px; }
.chip {
  font: 500 12px/1 var(--display); color: var(--muted); background: transparent; border: 1px solid var(--rule);
  border-radius: 999px; padding: 6px 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center;
}
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
.chip svg { width: 10px; height: 10px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
@media (max-width: 960px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.map { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; overflow-x: auto; min-width: 0; }
.map svg { display: block; }
.band-label { font: 600 11px var(--display); letter-spacing: 0.08em; text-transform: uppercase; fill: var(--muted); }
.band-count { font: 400 11px var(--mono); fill: var(--muted); }
.edge { fill: none; stroke: var(--edge); stroke-width: 0.7; opacity: 0.28; }
.edge.on { stroke: var(--accent); stroke-width: 1.4; opacity: 0.85; }
.edge.off { opacity: 0.05; }
.node { cursor: pointer; }
.node .mark { stroke: var(--ink); stroke-width: 1.3; }
.node.decided .mark { fill: var(--ink); }
.node.proposed .mark { fill: var(--panel); }
.node.proposed .core { fill: var(--ink); }
.node.open .mark { fill: var(--panel); stroke: var(--open); stroke-width: 1.8; }
.node.off { opacity: 0.14; }
.node.hit .halo { fill: var(--accent-soft); }
.node.sel .halo { fill: none; stroke: var(--accent); stroke-width: 2; }
.node .halo { fill: transparent; }
.sel-label { font: 500 11px var(--mono); fill: var(--accent); paint-order: stroke; stroke: var(--panel); stroke-width: 4px; }
.tip {
  position: fixed; pointer-events: none; z-index: 20; max-width: 320px; background: var(--ink); color: var(--bg);
  border-radius: 6px; padding: 7px 9px; font-size: 12px; line-height: 1.4;
}
.tip b { font-family: var(--mono); font-weight: 500; }
aside { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 16px; min-width: 0; }
.eyebrow { font: 600 11px var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.nid { font: 500 13px var(--mono); }
.title { font-size: 17px; font-weight: 600; line-height: 1.35; margin: 6px 0 10px; text-wrap: balance; }
.meta { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0 0 12px; font-size: 13px; }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 500 12px var(--display); }
.pill svg { width: 10px; height: 10px; }
.note { font-size: 13px; line-height: 1.5; color: var(--ink); background: var(--band); border-radius: 6px; padding: 8px 10px; margin: 0 0 12px; }
.note .k { color: var(--muted); font-weight: 600; }
h3 { font-size: 13px; margin: 16px 0 6px; display: flex; justify-content: space-between; }
h3 span { font: 400 12px var(--mono); color: var(--muted); }
.group { margin: 0 0 8px; }
.group .lvl { font: 600 10px var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 6px 0 2px; }
.item {
  display: grid; grid-template-columns: 12px auto 1fr; gap: 6px; align-items: baseline; width: 100%; text-align: left;
  font: inherit; font-size: 13px; color: var(--ink); background: none; border: 0; padding: 3px 4px; border-radius: 4px; cursor: pointer;
}
.item:hover { background: var(--band); }
.item .nid { font-size: 12px; }
.item .t { color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item svg { width: 9px; height: 9px; }
.more { font: inherit; font-size: 12px; color: var(--accent); background: none; border: 0; padding: 2px 4px; cursor: pointer; }
.summary { display: grid; gap: 6px; margin-top: 10px; }
.srow { display: grid; grid-template-columns: 92px 1fr 34px; gap: 8px; align-items: center; font-size: 12px; }
.srow .bar { display: flex; height: 8px; border-radius: 2px; overflow: hidden; background: var(--band); }
.srow .bar i { display: block; height: 100%; }
.srow .n { font-family: var(--mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; color: var(--muted); font-size: 12px; margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { width: 10px; height: 10px; }
p.hint { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0; }
a { color: var(--accent); }
.verdict { font-weight: 600; }
.tfile { margin: 10px 0 2px; display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
.tfile a { font-family: var(--mono); overflow-wrap: anywhere; }
.tfile span { color: var(--muted); white-space: nowrap; }
.titem {
  display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 6px; align-items: baseline; font-size: 13px;
  color: var(--ink); text-decoration: none; padding: 3px 4px; border-radius: 4px;
}
.titem:hover { background: var(--band); }
.titem:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.titem .name { overflow-wrap: anywhere; }
.titem .o { font-size: 11px; color: var(--muted); white-space: nowrap; }
.titem .o.failed { color: var(--fail); }
.titem svg, .tests-bar svg { width: 9px; height: 9px; }
.views { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.views button { font: 500 13px var(--display); color: var(--muted); background: var(--panel); border: 0; padding: 7px 12px; cursor: pointer; }
.views button[aria-pressed="true"] { color: var(--panel); background: var(--ink); }
.bugs { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 18px; min-width: 0; }
.tier + .tier { margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--rule); }
.tier h2 { font-size: 18px; margin: 4px 0 4px; }
.tier .why { color: var(--muted); margin: 0 0 6px; max-width: 70ch; line-height: 1.45; }
.stamp { font: 400 12px var(--mono); color: var(--muted); }
.stale { color: var(--open); font-weight: 600; margin: 8px 0 0; }
.score { display: flex; flex-wrap: wrap; align-items: end; gap: 6px 20px; margin: 14px 0 6px; }
.score .big { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.score .of { color: var(--muted); }
.range { position: relative; height: 22px; max-width: 520px; margin: 4px 0 2px; }
.range .track { position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--rule); }
.range .band { position: absolute; top: 5px; height: 12px; background: var(--accent-soft); border-radius: 2px; }
.range .point { position: absolute; top: 2px; width: 2px; height: 18px; background: var(--accent); }
.range-axis { display: flex; justify-content: space-between; max-width: 520px; font: 400 11px var(--mono); color: var(--muted); }
.fn { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr) 52px; gap: 10px; align-items: center; padding: 3px 0; }
.fn .name { font: 400 12px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fn .n { font: 400 12px var(--mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.cells { display: flex; flex-wrap: wrap; gap: 3px; }
.cell { width: 12px; height: 12px; border-radius: 2px; border: 1.5px solid transparent; padding: 0; cursor: pointer; }
.cell.caught { background: var(--accent); }
.cell.missed { background: var(--panel); border-color: var(--fail); }
.cell.timeout { background: var(--edge); }
.cell[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }
.cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.fns { margin-top: 16px; }
.diff { font: 400 12.5px/1.6 var(--mono); background: var(--band); border-radius: 6px; padding: 8px 10px; margin: 0 0 12px; overflow-wrap: anywhere; white-space: pre-wrap; }
.diff .del { color: var(--muted); text-decoration: line-through; }
.diff .add { color: var(--ink); font-weight: 500; }
code.cmd { display: block; font: 400 12px var(--mono); background: var(--band); border-radius: 6px; padding: 8px 10px; overflow-wrap: anywhere; }
.tests-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); margin-top: 6px; }
@media (prefers-reduced-motion: no-preference) { .node, .edge { transition: opacity 160ms ease; } }
</style>

</head>

<header>
  <div>

    <p class="sub" id="sub">Every decision and open question, from the strategy down to code. Click a node to light up what it rests on and what follows from it.</p>

  <div class="tools">

    <input id="q" type="search" placeholder="Search IDs and titles" aria-label="Search IDs and titles">
    <div class="chips" id="status-chips" role="group" aria-label="Status"></div>

</header>
<div class="owner-groups" id="owner-chips"></div>

<div class="layout">

d from Patrick's use-case instances, 2026-10-31 (workstreams/access-control/USE-CASE-INSTANCES.md).", "options": [{"id": "yes", "label": "Confirm as stated"}, {"id": "no", "label": "Something differs"}]}, {"id": "C1", "level": "need", "title": "Who decides the access settings for newly uploaded data?", "owner": "leadership", "status": "open", "parents": ["ST-4.1"], "source": "research/formalization/INN_use_case_decisions.pdf#C1", "options": [{"id": "uploader", "label": "The person uploading it."}, {"id": "project", "label": "The project's default settings."}, {"id": "terms", "label": "The conditions attached to the data, such as its agreement or sensitivity."}]}, {"id": "C2", "level": "need", "title": "Who can read access records in this release?", "owner": "leadership", "status": "decided", "parents": ["ST-4.1", "UC-5.5"], "source": "research/formalization/INN_use_case_decisions.pdf#C2", "decided": {"date": "2026-11-01", "by": "patrick (2026-11-01, in chat)", "answer": "Administrators and data owners (for their own data), and any change to the records can be detected.", "option": "tamper"}, "options": [{"id": "admins", "label": "Administrators."}, {"id": "owners", "label": "Data owners too, for their own data."}, {"id": "tamper", "label": "As above, and any change to the records can be detected."}, {"id": "later", "label": "None needed for this release."}]}, {"id": "C3", "level": "need", "title": "When the file list is filtered, what can be selected for download or delete?", "owner": "leadership", "status": "decided", "parents": ["UC-5.1"], "source": "research/formalization/INN_use_case_decisions.pdf#C3", "decided": {"date": "2026-10-30", "by": "patrick", "answer": "Selecting a folder selects only the files in it that the filter shows.", "option": "shownin"}, "options": [{"id": "filesonly", "label": "Only the files shown. Folders can't be selected while filtering (the fix in review)."}, {"id": "shownin", "label": "Selecting a folder selects only the files in it that the filter shows."}, {"id": "whole", "label": "Selecting a folder selects the whole folder, after a warning."}]}, {"id": "C4", "level": "need", "title": "Is access by type of file needed?", "owner": "leadership", "status": "decided", "parents": ["ST-2.4"], "source": "research/formalization/INN_use_case_decisions.pdf#C4", "decided": {"date": "2026-11-01", "by": "patrick (2026-11-01, in chat)", "answer": "Needed, both by file name ending (e.g. .nii) and by kind of data from its description."}, "options": [{"id": "no", "label": "Not needed. Folders are organised so access by folder is enough."}, {"id": "ext", "label": "Needed, by file name ending (for example .nii) within a folder."}, {"id": "kind", "label": "Needed, by what the data is (for example 'anatomical scan'), from its description."}]}, {"id": "C5", "level": "need", "title": "Is 'everything in this folder except ...' needed?", "owner": "leadership", "status": "decided", "parents": ["ST-2.4"], "source": "research/formalization/INN_use_case_decisions.pdf#C5", "decided": {"date": "2026-11-01", "by": "patrick (2026-11-01, in chat)", "answer": "Needed: a policy can cover a folder except some files or subfolders.", "option": "yes"}, "options": [{"id": "no", "label": "Not needed. Restricted files go in a separate folder."}, {"id": "yes", "label": "Needed."}]}, {"id": "C6", "level": "need", "title": "Should access be able to end on a date?", "owner": "leadership", "status": "decided", "parents": ["ST-2.4"], "source": "research/formalization/INN_use_case_decisions.pdf#C6", "decided": {"date": "2026-11-01", "by": "patrick (2026-11-01, in chat)", "answer": "Access can be given with an end date and ends automatically; administrators are reminded before end dates. Some grants, such as open datasets, have no end date."}, "options": [{"id": "no", "label": "Not needed now. Administrators remove access by hand."}, {"id": "date", "label": "Access can be given with an end date, and ends automatically."}, {"id": "remind", "label": "No automatic end, but administrators are reminded to review."}]}, {"id": "D1", "level": "need", "title": "How does identifiable data move between INN and ImageTech?", "owner": "leadership", "status": "decided", "parents": ["UC-5.1"], "source": "research/formalization/INN_use_case_decisions.pdf#D1", "decided": {"date": "2026-11-01", "by": "patrick (2026-11-01, in chat)", "answer": "All three: machine to machine started through the portal, by staff outside the portal, and through the portal by download and upload. Design a staging area and a pipeline-outputs area on each machine, with rules written for that machine's administrators on which direct changes the portal handles and which carry no guarantees."}, "options": [{"id": "direct", "label": "Directly from one machine to the other, started through the portal."}, {"id": "outside", "label": "By staff, outside the portal, as now."}, {"id": "viauser", "label": "Through the portal by download and upload."}]}, {"id": "D2", "level": "need", "title": "Who counts as an outside collaborator?", "owner": "leadership", "status": "open", "parents": ["ST-4.2"], "source": "research/formalization/INN_use_case_decisions.pdf#D2", "options": [{"id": "guest", "label": "Someone given a guest account when invited."}, {"id": "fed", "label": "Someone who signs in through their own institution."}, {"id": "link", "label": "Anyone holding the link or access code. No identity is recorded."}]}, {"id": "D3", "level": "need", "title": "When can files leave the POSIX machines?", "owner": "leadership", "status": "decided", "parents": ["ST-4.5"], "source": "research/formalization/INN_use_case_decisions.pdf#D3", "decided": {"date": "2026-11-01", "by": "patrick (2026-11-01, in chat)", "answer": "Only if the conditions attached to the file allow.", "option": "terms"}, "options": [{"id": "any", "label": "Any file can be downloaded."}, {"id": "terms", "label": "Only if the conditions attached to it allow."}, {"id": "approve", "label": "Only after someone approves it."}]}, {"id": "D4", "level": "need", "title": "What conditions apply to results uploaded back?", "owner": "leadership", "status": "open", "parents": ["ST-4.3", "UC-5.5"], "source": "research/formalization/INN_use_case_decisions.pdf#D4", "options": [{"id": "none", "label": "None. Results belong to the person who made them."}, {"id": "all", "label": "All the conditions of every dataset that went into them."}, {"id": "relax", "label": "All the conditions, unless an approved step (for example, aggregation) relaxes them."}]}, {"id": "D5", "level": "need", "title": "Who may see results made from protected data?", "owner": "leadership", "status": "open", "parents": ["ST-4.3", "ST-4.5"], "source": "research/formalization/INN_use_case_decisions.pdf#D5", "options": [{"id": "self", "label": "Only the researcher who made them."}, {"id": "sources", "label": "Anyone with access to all the data that went in."}, {"id": "terms", "label": "Whoever the conditions attached to the results allow."}]}, {"id": "D6", "level": "need", "title": "What counts as a copy of data?", "owner": "leadership", "status": "open", "parents": ["ST-4.6", "UC-5.4"], "source": "research/formalization/INN_use_case_decisions.pdf#D6", "options": [{"id": "data", "label": "Saved copies of the data itself."}, {"id": "results", "label": "Also results made from it."}, {"id": "all", "label": "Also temporary files, backups and log entries that identify it."}]}, {"id": "D7", "level": "need", "title": "May access records contain identifying details?", "owner": "leadership", "status": "decided", "parents": ["UC-5.4"], "source": "research/formalization/INN_use_case_decisions.pdf#D7", "decided": {"date": "2026-11-01", "by": "patrick (2026-11-01, in chat)", "answer": "Records may hold names as they are. Coding participant IDs in file names is the study team's responsibility; the portal doesn't enforce it for now. Enforcement rules can come later if needed.", "option": "yes"}, "options": [{"id": "yes", "label": "Yes, they may identify the data and the people involved."}, {"id": "coded", "label": "No, only coded references that can't identify anyone on their own."}]}, {"id": "D8", "level": "need", "title": "If a participant withdraws consent, what has to be removed?", "owner": "leadership", "status": "decided", "parents": ["UC-5.7"], "source": "research/formalization/INN_use_case_decisions.pdf#D8", "decided": {"date": "2026-11-01", "by": "patrick (2026-11-01, in chat)", "answer": "Any combination of original data, derived data and identifying log entries, as the case requires: the portal supports each, and the consent or agreement decides which apply."}, "options": [{"id": "data", "label": "Their original data."}, {"id": "derived", "label": "Also everything made from it."}, {"id": "logs", "label": "Also log entries that identify them."}]}, {"id": "D9", "level": "need", "title": "Does de-identifying data change the conditions that apply to it?", "owner": "leadership", "status": "decided", "parents": ["ST-4.7"], "source": "research/formalization/INN_use_case_decisions.pdf#D9", "decided": {"date": "2026-11-01", "by": "patrick (2026-11-01, in chat)", "answer": "An approved de-identification step can relax the conditions.", "option": "yes"}, "options": [{"id": "no", "label": "No. De-identified data keeps the original conditions."}, {"id": "yes", "label": "Yes. An approved de-identification step can relax them."}]}, {"id": "PRIV-1", "level": "need", "title": "Do consent forms or agreements name who must hold or control participants' data?", "owner": "privacy", "status": "open", "parents": ["UC-5.1"], "source": "research/formalization/INN_use_case_decisions.pdf#A1", "notes": "Asked in A1's 'Before answering'; privacy office or ethics board."}, {"id": "PRIV-2", "level": "need", "title": "Privacy impact assessment for bringing identifiable data into the portal", "owner": "privacy", "status": "open", "parents": ["UC-5.1"], "source": "research/formalization/INN_use_case_decisions.p le-security"], "source": "workstreams/data-transfer/STATUS.md", "decided": {"date": "2026-10-31", "by": "patrick", "answer": "Retire the Python bundler and BUNDLER_PROVIDER; the Java bundler is the only one"}, "notes": "Bundler review 2026-10-31: Python duplicates job lifecycle, its same-request deduplication would give two users one bundle ID (clashes with INN-272's one owner per bundle), and its download path looks broken under the current backend (inferred, not run).", "robust_to": []}, {"id": "CODE-retire-py-bundler", "level": "code", "title": "Retire the Python bundler and the BUNDLER_PROVIDER switch", "owner": "team", "status": "proposed", "parents": ["DT-PY-BUNDLER"], "source": "workstreams/data-transfer/STATUS.md", "branch": "chore/retire-python-bundler", "notes": "Checked 2026-10-31 merged onto bug/INN-272-recheck: access-control HTTP suite 25 passed, 2 xfailed (INN-294's), the same as the branch alone; its bundle tests go through the Java bundler. The staging Nomad service bundler-staging keeps running until the team stops it. posix/stack's local/docker-compose.posix.yaml still sets BUNDLER_PROVIDER (harmless; drop on the next restack)."}, {"id": "STD-QUARANTINE", "level": "need", "title": "What does quarantine hold back when uploaded data fails its standard's checks?", "owner": "leadership", "status": "open", "parents": ["UC-5.1"], "source": "INN-Data-Portal/docs/requirements/data-standards.md#STD-1", "options": [{"id": "shown", "label": "Nothing: the failure is recorded and shown to the researcher and administrators."}, {"id": "others", "label": "Everyone but the uploader and administrators can't see or download it until it's fixed."}, {"id": "all", "label": "Nobody can download or share it until it's fixed."}], "source_url": "https://github.com/pmahon3/Data-Portal/blob/development/docs/requirements/data-standards.md#STD-1"}, {"id": "DS-standard-declared", "level": "design", "title": "A folder declares its standard by the standard's own marker file at its root (BIDS: dataset_description.json)", "owner": "patrick", "status": "decided", "parents": ["DS-standard-seam"], "source": "INN-Data-Portal/docs/requirements/data-standards.md#STD-1", "decided": {"date": "2026-10-31", "by": "agent", "answer": "BIDS datasets already carry dataset_description.json at their root (required by the specification); using each standard's own marker needs no portal-specific flag and works for files placed directly on the machine"}, "robust_to": ["STD-WHICH", "STD-QUARANTINE"], "source_url": "https://github.com/pmahon3/Data-Portal/blob/development/docs/requirements/data-standards.md#STD-1"}, {"id": "DS-standard-names-first", "level": "design", "title": "First checks read names and layout from the file tree only; content checks run where the data is, later", "owner": "patrick", "status": "decided", "parents": ["DS-standard-seam"], "source": "INN-Data-Portal/docs/requirements/data-standards.md#STD-1", "decided": {"date": "2026-10-31", "by": "agent", "answer": "Names and layout are in the file tree, so checking them moves no file contents (PX-7) and runs in the request; sidecar and header checks need the bytes and belong beside the data"}, "robust_to": ["STD-WHICH", "STD-QUARANTINE"], "source_url": "https://github.com/pmahon3/Data-Portal/blob/development/docs/requirements/data-standards.md#STD-1"}, {"id": "CODE-standard-seam", "level": "code", "title": "Validation seam: declared datasets checked when an upload completes; result recorded, quarantine as a state", "owner": "patrick", "status": "proposed", "parents": ["FEAT-standards", "DS-standard-seam", "DS-standard-declared", "DS-standard-names-first"], "source": "INN-Data-Portal/docs/requirements/data-standards.md#STD-1", "branch": "feat/standard-seam", "notes": "Conflicts with feat/notifications in one place: the single-file upload's return line (this adds checks; notifications adds a notification just before it). Resolution keeps both.", "robust_to": ["STD-WHICH", "STD-QUARANTINE"], "source_url": "https://github.com/pmahon3/Data-Portal/blob/development/docs/requirements/data-standards.md#STD-1"}, {"id": "CODE-standard-content", "level": "code", "title": "Content checks (sidecars, image headers) run on the storage machine", "owner": "patrick", "status": "open", "parents": ["FEAT-standards", "CODE-standard-seam"], "source": "INN-Data-Portal/docs/requirements/data-standards.md#STD-1", "deferred": "names and layout first; content checks need code beside the data (PX-7)", "source_url": "https://github.com/pmahon3/Data-Portal/blob/development/docs/requirements/data-standards.md#STD-1"}, {"id": "CODE-tls-in-service", "level": "code", "title": "File service serves HTTPS itself (GATEWAY_TLS_CERT, GATEWAY_TLS_KEY)", "owner": "patrick", "status": "proposed", "parents": ["FEAT-posix-access", "DS-tls-in-service"], "source": "workstreams/posix-storage/MR-STACK.md", "branch": "posix/stack"}, {"id": "DS-policy-from-selection", "level": "design", "title": "Grant by choosing from the file tree: fixed mapping from selection to rules, previewed in plain words, through the policy API", "owner": "patrick", "status": "decided", "parents": ["FEAT-authz", "AC-4", "AC-5"], "source": "workstreams/access-control/USE-CASE-INSTANCES.md", "decided": {"date": "2026-10-31", "by": "agent", "answer": "As in USE-CASE-INSTANCES.md 'Choosing from the file tree': a ticked folder (no filter) is folder/*; files one rule each, never collapsed; under a filter one rule per shown file; previewed in plain words; saved one POST per rule through the policy API"}}, {"id": "DS-move-prompt", "level": "design", "title": "Offer to carry access over when a file is moved or renamed", "owner": "patrick", "status": "open", "parents": ["R-RENAME"], "source": "workstreams/access-control/USE-CASE-INSTANCES.md", "deferred": "access is by name for now (use-case instance 4); a prompt may come later"}, {"id": "DOC-policy-guide", "level": "doc", "title": "Giving people access (for administrators and project managers)", "owner": "patrick", "status": "proposed", "parents": ["AC-1", "AC-10", "AC-4", "AC-5", "FEAT-authz"], "source": "INN-Data-Portal/docs/user-guide/policies.md", "source_url": "https://github.com/pmahon3/Data-Portal/blob/development/docs/user-guide/policies.md"}, {"id": "CODE-policy-from-selection", "level": "code", "title": "Policy form: choose the resource from the file tree; ticks become per-file or folder rules, previewed, saved through the policy API", "owner": "patrick", "status": "proposed", "parents": ["DS-policy-from-selection"], "source": "INN-Data-Portal/frontend/src/components/admin_page/policy_management/treeRules.js", "branch": "feat/policy-from-selection", "notes": "Merged into GitHub development 2026-10-31.", "source_url": "https://github.com/pmahon3/Data-Portal/blob/development/frontend/src/components/admin_page/policy_management/treeRules.js"}, {"id": "DOC-getting-started", "level": "doc", "title": "Getting started: signing in, and what researchers and administrators see", "owner": "patrick", "status": "proposed", "parents": ["AC-1", "AC-5", "FEAT-authz"], "source": "INN-Data-Portal/docs/user-guide/getting-started.md", "branch": "docs/user-guide-pages", "source_url": "https://github.com/pmahon3/Data-Portal/blob/development/docs/user-guide/getting-started.md"}, {"id": "DOC-downloading", "level": "doc", "title": "Finding and downloading files", "owner": "patrick", "status": "proposed", "parents": ["AC-3", "AC-4", "FEAT-authz"], "source": "INN-Data-Portal/docs/user-guide/downloading.md", "branch": "docs/user-guide-pages", "source_url": "https://github.com/pmahon3/Data-Portal/blob/development/docs/user-guide/downloading.md"}, {"id": "DOC-uploading", "level": "doc", "title": "Uploading files and folders", "owner": "patrick", "status": "proposed", "parents": ["AC-2", "AC-3", "FEAT-authz"], "source": "INN-Data-Portal/docs/user-guide/uploading.md", "branch": "docs/user-guide-pages", "source_url": "https://github.com/pmahon3/Data-Portal/blob/development/d  "Not built: dropped 2026-11-02; Check Access answers a person's access, and project grants (DS-relationship-grants) give access by relationship"}, "notes": "Superseded 2026-11-02 by DS-relationship-grants (legibility by relationship, step 4) and Check Access; tree markers skipped 2026-11-02. The per-person branch feat/who-has-access is dropped."}, {"id": "DS-grant-extent-preview", "level": "design", "title": "Before saving a policy, show its concrete extent: how many files now, and that later additions are included", "owner": "patrick", "status": "open", "parents": ["AC-5", "FEAT-authz"], "source": "workstreams/access-control/POLICY-PREVIEW.md"}, {"id": "DS-broad-grant-warning", "level": "design", "title": "Warn when a policy covers a folder high in the tree, or the whole instance", "owner": "patrick", "status": "decided", "parents": ["AC-5", "FEAT-authz"], "source": "workstreams/access-control/POLICY-PREVIEW.md", "decided": {"date": "2026-11-03", "by": "agent", "answer": "One sentence above Create Policy when a policy covers the whole instance (*) or a whole bucket (bucket/*), typed or ticked; warns, doesn't block; pure frontend (POLICY-PREVIEW.md)"}}, {"id": "DS-rename-warning", "level": "design", "title": "Warn when renaming or moving a file or folder that others have access to by name", "owner": "patrick", "status": "decided", "parents": ["AC-5", "FEAT-authz"], "source": "workstreams/data-transfer/reports/Explaining access rules to users.md", "decided": {"date": "2026-11-02", "by": "agent", "answer": "Deferred: the portal has no rename or move action (renames happen in storage, then sync), so a warning has nowhere to appear. Build it with a rename action, if one is added."}}, {"id": "DS-check-access", "level": "design", "title": "A check-access tool: can this person do this action on this path, and which policy allows it", "owner": "patrick", "status": "decided", "parents": ["AC-1", "AC-3", "FEAT-authz"], "source": "workstreams/access-control/CHECK-ACCESS.md", "decided": {"date": "2026-11-02", "by": "agent", "answer": "GET /api/policies/check and a Check Access panel; answered by Checker with the policies that allow it (rules.covering); scoped like policy listing."}}, {"id": "DS-policy-reason", "level": "design", "title": "Record why each policy exists (a reason field on the policy)", "owner": "patrick", "status": "open", "parents": ["FEAT-authz"], "source": "workstreams/data-transfer/reports/Explaining access rules to users.md"}, {"id": "CODE-rename-and-link-tests", "level": "code", "title": "Tests for access by name (rename and move) and for download-link expiry, which the guide states without a test", "owner": "patrick", "status": "proposed", "parents": ["FEAT-authz"], "source": "workstreams/data-transfer/reports/Explaining access rules to users.md", "branch": "test/access-by-name-and-links", "notes": "Merged into GitHub development 2026-11-02. A portal sync only adds and updates, so a renamed file's old entry stays in the tree until removed by hand."}, {"id": "AC-10", "level": "requirement", "title": "A permission on a folder can exclude named files or folders inside it", "owner": "leadership", "status": "decided", "parents": ["ST-2.4", "C5"], "source": "INN-Data-Portal/docs/requirements/access-control.md#AC-10", "notes": "Settled by C5 (Patrick, 2026-11-01). Not built; changes the 'policies only add up' model in the user guide when it is.", "source_url": "https://github.com/pmahon3/Data-Portal/blob/development/docs/requirements/access-control.md#AC-10"}, {"id": "DS-policy-conditions", "level": "design", "title": "Policy conditions: one optional field read only by rules.py (exclusions, file types, end dates)", "owner": "patrick", "status": "decided", "parents": ["AC-6", "AC-8", "AC-10", "FEAT-authz", "AC-11"], "source": "workstreams/access-control/POLICY-CONDITIONS.md", "decided": {"date": "2026-11-01", "by": "patrick (exclusion semantics and picker) and agent (storage, enforcement, reminders)", "answer": "Exclusions belong to one folder policy; the picker turns a ticked folder with unticked items into one policy with exclusions; conditions in one JSON field; end dates enforced when deciding; reminders 14 days ahead to administrators and project managers."}, "notes": "Kinds revised 2026-11-01 (agent): classified by path at decision time through the standard's plugin, not a stored column."}, {"id": "CODE-policy-end-dates", "level": "code", "title": "Policies can end on a date: conditions seam, Checker skips ended policies, policy API and form", "owner": "patrick", "status": "proposed", "parents": ["DS-policy-conditions"], "source": "INN-Data-Portal/backend/core/services/policies/rules.py", "branch": "feat/policy-end-dates", "notes": "Merged into GitHub development 2026-11-01.", "source_url": "https://github.com/pmahon3/Data-Portal/blob/development/backend/core/services/policies/rules.py"}, {"id": "CODE-policy-end-reminders", "level": "code", "title": "Reminders to administrators and project managers before a policy ends", "owner": "patrick", "status": "proposed", "parents": ["DS-policy-conditions"], "source": "INN-Data-Portal/backend/core/services/policies/end_reminders.py", "branch": "feat/policy-end-reminders", "notes": "Merged into GitHub development 2026-11-01.", "source_url": "https://github.com/pmahon3/Data-Portal/blob/development/backend/core/services/policies/end_reminders.py"}, {"id": "CODE-policy-exclusions", "level": "code", "title": "A folder policy can exclude files or folders inside it; the tree picker makes them", "owner": "patrick", "status": "proposed", "parents": ["DS-policy-conditions"], "source": "INN-Data-Portal/backend/core/services/policies/rules.py", "branch": "feat/policy-exclusions", "notes": "Merged into GitHub development 2026-11-01.", "source_url": "https://github.com/pmahon3/Data-Portal/blob/development/backend/core/services/policies/rules.py"}, {"id": "CODE-policy-endings", "level": "code", "title": "A folder policy can be limited to file name endings", "owner": "patrick", "status": "proposed", "parents": ["DS-policy-conditions"], "source": "INN-Data-Portal/backend/core/services/policies/rules.py", "branch": "feat/policy-endings", "notes": "Merged into GitHub development 2026-11-01.", "source_url": "https://github.com/pmahon3/Data-Portal/blob/development/backend/core/services/policies/rules.py"}, {"id": "CODE-policy-kinds", "level": "code", "title": "A folder policy can be limited to kinds of data, classified by the dataset's standard", "owner": "patrick", "status": "proposed", "parents": ["DS-policy-conditions"], "source": "INN-Data-Portal/backend/core/services/standards/bids.py", "branch": "feat/policy-kinds", "notes": "Merged into GitHub development 2026-11-01.", "robust_to": ["STD-WHICH"], "source_url": "https://github.com/pmahon3/Data-Portal/blob/development/backend/core/services/standards/bids.py"}, {"id": "AC-11", "level": "requirement", "title": "Access decisions stay fast as data and permissions grow (targets)", "owner": "rdt", "status": "proposed", "parents": ["UC-5.4", "UC-5.8", "AC-6", "AC-8", "AC-10"], "source": "INN-Data-Portal/docs/requirements/access-control.md#AC-11", "notes": "Targets first proposed in workstreams/access-control/AUTHZ-PLAN.md (2026-10-19); added as a requirement 2026-11-02 after conditioned policies were measured at 30-50 s per 100,000 files.", "source_url": "https://github.com/pmahon3/Data-Portal/blob/development/docs/requirements/access-control.md#AC-11"}, {"id": "CODE-policy-check-scaling", "level": "code", "title": "Conditioned policies looked up by folder, like plain ones", "owner": "patrick", "status": "decided", "parents": ["DS-policy-conditions"], "source": "INN-Data-Portal/backend/core/services/policies/rules.py", "branch": "fix/policy-check-scaling", "decided": {"date": "2026-11-02", "by": "agent", "answer": "Conditioned policies indexed by folder; per-folder endings filter; timing tests for AC-11 in the gate"}, "notes": "Merged into GitHub development 2026-11-02.", "robust_to": ["AC-11"], "source_url": "https://github.com/pmahon3/Data-Portal/blob/development/backend/core/services/policies/rules.py"}, {"id": "AR-SCOPE", "level": "need", "title": "Besides reading and changing data, are browsing (names seen) and changes to access recorded?", "owner": "leadership", "status": "open", "parents": ["UC-5.1"], "source": "workstreams/access-control/ACCESS-RECORDS.md#questions-for-others", "options": [{"id": "neither", "label": "Neither: only reading, uploading and deleting data."}, {"id": "changes", "label": "Also changes to access (who gave or removed which policy)."}, {"id": "browsing", "label": "Also browsing: which folder listings, and so which file names, each person saw."}, {"id": "both", "label": "Both."}]}, {"id": "AR-RETAIN", "level": "need", "title": "How long are access records kept?", "owner": "privacy", "status": "open", "parents": ["UC-5.1"], "source": "workstreams/access-control/ACCESS-RECORDS.md#questions-for-others", "options": [{"id": "always", "label": "Indefinitely."}, {"id": "years", "label": "A fixed number of years (say how many)."}, {"id": "study", "label": "As long as the study's data, plus a set period."}]}, {"id": "AR-ANCHOR", "level": "constraint", "title": "Where can the access-record chain's latest value be kept out of reach of the database's administrators?", "owner": "sysadmins", "status": "open", "parents": [], "source": "workstreams/access-control/ACCESS-RECORDS.md#questions-for-others", "options": [{"id": "objectlock", "label": "An object-storage bucket with object lock."}, {"id": "host", "label": "A file on a separate machine."}, {"id": "mail", "label": "A message to administrators."}]}, {"id": "AR-CEPH-GET", "level": "constraint", "title": "Can Ceph's ops log record each read, with the signed link's ID?", "owner": "sysadmins", "status": "open", "parents": [], "source": "workstreams/access-control/ACCESS-RECORDS.md#what-the-portal-can-see", "options": [{"id": "yes", "label": "Yes"}, {"id": "no", "label": "No"}]}, {"id": "FEAT-access-records", "level": "feature", "title": "Access records: tamper-evident, readable by administrators and data owners", "owner": "patrick", "status": "open", "parents": ["AC-9"], "source": "workstreams/access-control/ACCESS-RECORDS.md"}, {"id": "DS-access-records", "level": "design", "title": "Request records with salted file rows in PostgreSQL, a hash chain anchored outside the database, erasable without breaking it", "owner": "patrick", "status": "proposed", "parents": ["FEAT-access-records", "AR-SCOPE", "AR-RETAIN", "AR-ANCHOR", "AR-CEPH-GET"], "source": "workstreams/access-control/ACCESS-RECORDS.md", "notes": "Data owners are taken to be the managers of each project that includes the instance (as end-date reminders); if owners are per dataset, only the read filter changes. AC-7 erasure and PX-10 machine records arrive through the same writer.", "robust_to": ["AR-SCOPE", "AR-RETAIN", "AR-ANCHOR", "AR-CEPH-GET", "D6"], "one_way": "The hashing scheme (what each digest covers, the canonical form) is fixed once records exist: changing it means verifying old records under the old scheme forever. Patrick reviews it before code."}, {"id": "CODE-policy-store-reads", "level": "code", "title": "Policies read and written in MongoDB, not Casbin's in-memory copy (stale across backend processes; misreads '[')", "owner": "patrick", "status": "proposed", "parents": ["FEAT-authz"], "source": "INN-Data-Portal/backend/core/services/policies/casbin/CasbinPolicyManager.py", "branch": "fix/policy-listings-from-store", "notes": "Merged into GitHub development 2026-11-02. Found while planning the who-has-access view: on development a policy on a path with '[' made the policies listing fail (500).", "source_url": "https://github.com/pmahon3/Data-Portal/blob/development/backend/core/services/policies/casbin/CasbinPolicyManager.py"}, {"id": "CODE-check-access", "level": "code", "title": "Check a person's access, and which of their policies allows it", "owner" const LEVELS = ["goal", "usecase", "need", "requirement", "feature", "constraint", "design", "code", "doc"];
const LEVEL_NAMES = { goal: "Strategy", usecase: "Use cases", need: "Needs", requirement: "Requirements", feature: "Features",
  constraint: "Constraints", design: "Design", code: "Code", doc: "User docs" };
const STATUS = ["decided", "proposed", "open"];
const STATUS_NAMES = { decided: "Decided", proposed: "Proposed", open: "Open" };

const byId = new Map(DATA.nodes.map((n) => [n.id, n]));
const children = new Map(DATA.nodes.map((n) => [n.id, []]));
const edges = [];
for (const n of DATA.nodes) {
  n.parents = n.parents.filter((p) => byId.has(p));
  for (const p of n.parents) { children.get(p).push(n.id); edges.push([p, n.id]); }
}

// Order each band so links cross as little as possible: barycenter sweeps down, then up.
const bands = LEVELS.map((l) => DATA.nodes.filter((n) => n.level === l).map((n) => n.id));
const pos = new Map();
const natural = (a, b) => a.localeCompare(b, undefined, { numeric: true });
bands.forEach((b) => { b.sort(natural); b.forEach((id, i) => pos.set(id, (i + 0.5) / b.length)); });
function sweep(band, neighbours) {
  const score = new Map(band.map((id) => {
    const ns = neighbours(id);
    return [id, ns.length ? ns.reduce((s, x) => s + pos.get(x), 0) / ns.length : pos.get(id)];
  }));
  band.sort((a, b) => score.get(a) - score.get(b) || natural(a, b));
  band.forEach((id, i) => pos.set(id, (i + 0.5) / band.length));
}
for (let k = 0; k < 8; k++) {
  bands.forEach((b) => sweep(b, (id) => byId.get(id).parents));
  [...bands].reverse().forEach((b) => sweep(b, (id) => children.get(id)));
}

function closure(start, next) {

  while (stack.length) { const x = stack.pop(); if (!seen.has(x)) { seen.add(x); stack.push(...next(x)); } }
  return seen;
}
const ancestorsOf = (id) => closure(id, (x) => byId.get(x).parents);
const descendantsOf = (id) => closure(id, (x) => children.get(x));

const state = { sel: null, q: "", status: new Set(STATUS), owners: new Set(DATA.owners), view: "map", bug: null };

// --- drawing ---
const SVGNS = "http://www.w3.org/2000/svg";
const map = document.getElementById("map");
const tip = document.getElementById("tip");

  for (const k in attrs) e.setAttribute(k, attrs[k]);

}

  const g = el("g", { class: `node ${status}` }, s);
  el("circle", { class: "mark", r }, g);

  return s;

function draw() {
  const W = Math.max(map.clientWidth, 760);

  map.textContent = "";
  const svg = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img",

  const x = (id) => GUTTER + pos.get(id) * (W - GUTTER - 18);
  const y = (id) => TOP + LEVELS.indexOf(byId.get(id).level) * BAND + BAND / 2;

  LEVELS.forEach((l, i) => {
    const yy = TOP + i * BAND;
    if (i % 2 === 0) el("rect", { x: 0, y: yy, width: W, height: BAND, fill: "var(--band)" }, svg);
    const t = el("text", { x: 14, y: yy + BAND / 2 - 2, class: "band-label" }, svg); t.textContent = LEVEL_NAMES[l];
    const c = el("text", { x: 14, y: yy + BAND / 2 + 13, class: "band-count" }, svg); c.textContent = bands[i].length;
  });

  const eg = el("g", {}, svg);
  geom.edgeEls = edges.map(([p, c]) => {
    const x1 = x(p), y1 = y(p), x2 = x(c), y2 = y(c);
    let d;
    if (y1 === y2) { const lift = Math.min(26, 8 + Math.abs(x2 - x1) * 0.15); d = `M${x1},${y1} C${x1},${y1 - lift} ${x2},${y2 - lift} ${x2},${y2}`; }

function showTip(n, ev) {

function matches(n) {

function paint() {

    g.classList.toggle("off", !ok);

    g.classList.toggle("sel", n.id === state.sel);
  }
  for (const { p, c, e } of geom.edgeEls) {

// --- tests ---
// Each requirement's tests are the ones that name it; DATA.tests holds them with their latest gate outcomes.
const OUTCOMES = { passed: "passed", failed: "failed", xfailed: "known failing", skipped: "skipped", "not run": "not run" };
const testsOf = (id) => (DATA.tests || {})[id] || [];
function link(url, text) { const a = h("a", null, text); a.href = url; a.target = "_blank"; a.rel = "noopener"; return a; }
function outcomeGlyph(o) {
  const s = document.createElementNS(SVGNS, "svg"); s.setAttribute("viewBox", "-6 -6 12 12"); s.setAttribute("aria-hidden", "true");
  const c = el("circle", { r: 4.4, "stroke-width": 1.5 }, s);

  c.setAttribute("stroke", colour);
  c.setAttribute("fill", o === "passed" || o === "failed" ? colour : "none");

}
// Example: 5 tests, 3 passed, 2 not run -> "3 of 5 passed in their latest gate run; 2 not run."
function verdict(n, tests) {
  if (!tests.length) return n.level === "usecase" ? "No acceptance scenario walks this use case yet." : `No test names ${n.id} yet.`;
  const passed = tests.filter((t) => t.outcome === "passed").length;
  if (passed === tests.length)
    return n.level === "usecase" ? `Proven end to end: all ${passed} acceptance scenarios passed in their latest gate run.`
      : `All ${passed} passed in their latest gate run.`;
  const rest = Object.keys(OUTCOMES).filter((o) => o !== "passed")
    .map((o) => [tests.filter((t) => t.outcome === o).length, OUTCOMES[o]]).filter(([k]) => k).map(([k, o]) => `${k} ${o}`);
  return `${passed} of ${tests.length} passed in their latest gate run; ${rest.join(", ")}.`;
}
// Example: "test_a_user_can_read_a_file" -> "a user can read a file"; scenario and Jest titles are already words.
const plainName = (name) => /^test_/.test(name) ? name.slice(5).replace(/_/g, " ") : name;
function testsSection(n) {
  const tests = testsOf(n.id);
  if (!tests.length && !["requirement", "usecase"].includes(n.level)) return null;
  const wrap = h("div");
  const head = h("h3", null, n.level === "usecase" ? "Acceptance tests" : "Tested by"); head.append(h("span", null, String(tests.length)));
  wrap.append(head, h("p", "note verdict", verdict(n, tests)));
  const caught = tests.reduce((k, t) => k + (t.caught || 0), 0);
  if (caught) {
    const p = h("p", "note"); p.append(h("span", "k", "Planted bugs: "),
      `these tests were the first to catch ${caught} of the ${BUGS.reduce((k, t) => k + t.bugs.filter((b) => b.outcome === "caught").length, 0)} small bugs caught when they were planted in the riskiest code. `);
    const go = h("button", "more", "See the planted bugs"); go.type = "button";
    go.addEventListener("click", () => setView("bugs")); p.append(go);
    wrap.append(p);
  }
  wrap.append(h("p", "hint", n.level === "usecase"
    ? `A test counts for ${n.id} when its file says "Accepts: ${n.id}" or its scenario is tagged @acceptance @${n.id}. Each result is from the latest gate run that ran it.`
    : `A test counts for ${n.id} when it starts by naming it: "${n.id}." in its docstring, a "// ${n.id}:" comment above it, or an @${n.id} tag. Each result is from the latest gate run that ran it.`));
  const byFile = new Map();
  for (const t of tests) { if (!byFile.has(t.file)) byFile.set(t.file, []); byFile.get(t.file).push(t); }
  const rank = (t) => ["failed", "xfailed", "not run", "skipped", "passed"].indexOf(t.outcome);
  for (const [file, list] of byFile) {
    list.sort((a, b) => rank(a) - rank(b) || a.line - b.line);
    const passed = list.filter((t) => t.outcome === "passed").length;
    const row = h("div", "tfile");
    const short = file.split("/").slice(-2).join("/");
    const a = link(list[0].url.split("#")[0], short); a.title = file;
    row.append(a, h("span", null, passed === list.length ? `${list.length} · all passed` : `${passed} of ${list.length} passed`));
    const box = h("div");
    wrap.append(row, box);
    const LIMIT = 5;
    const add = (part) => part.forEach((t) => {
      const item = link(t.url, ""); item.className = "titem";
      const when = t.run ? `${t.run.date}, ${t.run.branch}` : t.outcome === "not run" ? "" : `on or before ${DATA.results_date}`;
      item.title = `${t.name}\n${t.file}, line ${t.line}: ${OUTCOMES[t.outcome]}${when ? ` (${when})` : ""}`;
      const said = OUTCOMES[t.outcome] + (t.caught ? ` · caught ${t.caught}` : "");
      item.append(outcomeGlyph(t.outcome), h("span", "name", plainName(t.name)), h("span", `o ${t.outcome}`, said));
      box.append(item);
    });
    add(list.slice(0, LIMIT));
    if (list.length > LIMIT) {
      const more = h("button", "more", `Show ${list.length - LIMIT} more`); more.type = "button";
      more.addEventListener("click", () => { more.remove(); add(list.slice(LIMIT)); });
      wrap.append(more);
    }
  }
  return wrap;
}
function testsOverview() {
  const reqs = DATA.nodes.filter((n) => n.level === "requirement");
  const counts = { passing: 0, partly: 0, none: 0 };
  for (const r of reqs) {
    const t = testsOf(r.id);
    counts[!t.length ? "none" : t.every((x) => x.outcome === "passed") ? "passing" : "partly"]++;
  }

  const bar = h("div", "bar"); bar.style.cssText = "display:flex;height:8px;border-radius:2px;overflow:hidden;background:var(--band)";
  const parts = [["passing", "var(--accent)", "every test passed"], ["partly", "var(--edge)", "not all passed or run"], ["none", "var(--open)", "no tests"]];

// --- planted bugs (tools/mutate.py): one small change to the code at a time, then the tests ---
const BUGS = DATA.mutation || [];
const OPERATOR_WORDS = { compare: "turned a comparison around", bool: "swapped and / or", condition: "negated a condition",
  not: "dropped a not", constant: "flipped True / False", number: "changed a number by one", return: "returned nothing",
  statement: "skipped a step", loop: "swapped break / continue", arithmetic: "swapped + and −" };
const OUTCOME_WORDS = { caught: "caught", missed: "missed", timeout: "never finished" };
// Example: 175 caught of 207 judged (4 timeouts set apart) -> [0.79, 0.89]
function wilson(k, n, z = 1.96) {
  if (!n) return [0, 1];
  const p = k / n, d = 1 + z * z / n, c = (p + z * z / (2 * n)) / d;
  const half = (z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n))) / d;
  return [Math.max(0, c - half), Math.min(1, c + half)];
}
const pct = (x) => `${Math.round(100 * x)}%`;
const shortFile = (f) => f.split("/").pop();

function drawBugs() {
  const root = document.getElementById("bugs");
  root.textContent = "";
  for (const t of BUGS) {
    const card = h("section", "tier");
    const judged = t.bugs.filter((b) => b.outcome !== "timeout");
    const caught = judged.filter((b) => b.outcome === "caught").length;
    const timeouts = t.bugs.length - judged.length;
    const [lo, hi] = wilson(caught, judged.length);
    card.append(h("div", "eyebrow", `Tier ${t.tier}`), h("h2", null, t.name), h("p", "why", t.why));
    card.append(h("div", "stamp", `${t.files.map(shortFile).join(", ")} · ${t.ref} at ${t.commit.slice(0, 7)} · ${t.date}`));
    if (t.stale) card.append(h("p", "stale", `The code has changed since this run; rerun tools/mutate.py run ${t.tier}.`));
    const score = h("div", "score");
    const big = h("div"); big.append(h("span", "big", `${caught} of ${judged.length}`), h("span", "of", " planted bugs caught"));
    score.append(big, h("div", "of", `${pct(caught / Math.max(judged.length, 1))}, and 95% sure it's between ${pct(lo)} and ${pct(hi)}`
      + (t.bugs.length < t.total ? ` (a sample of ${t.bugs.length} of ${t.total})` : ` (all ${t.total} the tool can plant)`)
      + (timeouts ? `; ${timeouts} more made the code never finish` : "")));
    card.append(score);
    const range = h("div", "range"); range.setAttribute("role", "img");
    range.setAttribute("aria-label", `Share caught ${pct(caught / Math.max(judged.length, 1))}, interval ${pct(lo)} to ${pct(hi)}`);
    const band = h("div", "band"); band.style.left = pct(lo); band.style.width = `${100 * (hi - lo)}%`;
    const point = h("div", "point"); point.style.left = `calc(${pct(caught / Math.max(judged.length, 1))} - 1px)`;
    range.append(h("div", "track"), band, point);
    const axis = h("div", "range-axis"); ["0%", "50%", "100%"].forEach((x) => axis.append(h("span", null, x)));
    card.append(range, axis);
    const lg = h("div", "legend");
    for (const o of ["caught", "missed", "timeout"]) {
      const sp = h("span"); const sw = h("i", `cell ${o}`); sw.style.cursor = "default"; sp.append(sw, OUTCOME_WORDS[o]); lg.append(sp);
    }
    card.append(lg);
    // One row per function, in the order they appear in the file; one square per planted bug.
    const byFn = new Map();
    for (const b of [...t.bugs].sort((a, b) => a.line - b.line || a.id - b.id)) {
      const key = `${b.file}::${b.function}`;
      if (!byFn.has(key)) byFn.set(key, []);
      byFn.get(key).push(b);
    }
    const fns = h("div", "fns");
    for (const [key, list] of byFn) {
      const row = h("div", "fn");
      const fname = key.split("::")[1];
      const name = h("span", "name", fname); name.title = `${key.split("::")[0]}: ${fname}`;
      const cells = h("div", "cells");
      for (const b of list) {
        const c = h("button", `cell ${b.outcome}`); c.type = "button";
        const label = `Line ${b.line}: ${b.before} → ${b.after}, ${OUTCOME_WORDS[b.outcome]}`;
        c.title = label; c.setAttribute("aria-label", label);
        c.setAttribute("aria-pressed", String(state.bug && state.bug.t === t && state.bug.b === b));
        c.addEventListener("click", () => { state.bug = { t, b }; drawBugs(); renderBugPanel(); });
        cells.append(c);
      }
      const k = list.filter((b) => b.outcome === "caught").length;
      const judgedHere = list.filter((b) => b.outcome !== "timeout").length;
      row.append(name, cells, h("span", "n", `${k}/${judgedHere}`));
      fns.append(row);
    }
    card.append(fns);
    root.append(card);
  }
}

function renderBugPanel() {
  panel.textContent = "";

    panel.append(h("div", "eyebrow", "Planted bugs"), h("div", "title", "Would the tests notice if the code were wrong?"));
    for (const text of [
      "A planted bug is one small change to the code: a comparison turned around, \"and\" for \"or\", a condition negated, a step skipped. The tool puts one in a copy of the code, runs the tests, and puts it back. Then the next.",
      "Caught means a test failed, and the tool records which one. Missed means every test still passed: either the tests have a gap there, or the change can't make a difference. A person decides which.",
      "The share caught comes with a 95% interval: how sure we can be, given how many bugs were tried.",
      "Click a square to see that bug, the test that caught it, and how to rerun it yourself."]) panel.append(h("p", "hint", text), h("br"));

function ownerLabel(n) {
  if (isBuilder(n.owner)) return "Built by";
  return n.status === "open" ? "Waiting on" : "Answered by";
}
for (const [label, members] of [["Waiting on", DATA.owners.filter((o) => !isBuilder(o))],
                                ["Built by", DATA.owners.filter(isBuilder)]]) {
  const group = h("div", "chips"); group.setAttribute("role", "group"); group.setAttribute("aria-label", label);
  group.append(h("span", "eyebrow", label));
  for (const o of members) {
    const b = h("button", "chip", o); b.type = "button"; b.setAttribute("aria-pressed", "true");
    b.addEventListener("click", () => {
      state.owners.has(o) ? state.owners.delete(o) : state.owners.add(o);
      b.setAttribute("aria-pressed", String(state.owners.has(o))); paint();
    });
    group.append(b);
  }
  ownerChips.append(group);
}
const q = document.getElementById("q");
q.addEventListener("input", () => { state.q = q.value.trim().toLowerCase(); paint(); });
q.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter") { const first = DATA.nodes.find((n) => state.q && matches(n)); if (first) select(first.id); }
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") { q.value = ""; state.q = ""; select(null); } });

const GITHUB_BLOB = "https://github.com/pmahon3/Data-Portal/blob";
if (BUGS.length) {
  const views = document.getElementById("views"); views.hidden = false;
  for (const [v, label] of [["map", "Decision map"], ["bugs", "Planted bugs"]]) {
    const b = h("button", null, label); b.type = "button"; b.dataset.view = v; b.setAttribute("aria-pressed", String(v === "map"));
    b.addEventListener("click", () => setView(v)); views.append(b);
  }
}

let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (state.view === "map") draw(); }, 120); });
const start = decodeURIComponent(location.hash.slice(1));
state.sel = byId.has(start) ? start : (byId.has(DATA.start) ? DATA.start : null);
draw();
</script>

</body>
</html>
