<style>
/* Layout: one horizontal band per level, strategy at the top and code at the bottom; a reading panel beside it. */
:root {
  --bg: #f4f5f1;
  --panel: #fbfbf8;
  --ink: #1b2422;
  --muted: #5f6b67;
  --rule: #d9ddd6;
  --accent: #0d6b66;
  --accent-soft: #cfe5e1;
  --open: #b4691c;
  --edge: #8a958f;
  --band: #eceee8;
  --display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111615; --panel: #171d1c; --ink: #e2e8e5; --muted: #95a29d; --rule: #2a3331;
    --accent: #5ec4b9; --accent-soft: #1d3a37; --open: #e0a44e; --edge: #6d7a75; --band: #151b1a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111615; --panel: #171d1c; --ink: #e2e8e5; --muted: #95a29d; --rule: #2a3331;
  --accent: #5ec4b9; --accent-soft: #1d3a37; --open: #e0a44e; --edge: #6d7a75; --band: #151b1a;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--display); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px;
  box-sizing: border-box;
}
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; margin-bottom: 14px; }
h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 62ch; line-height: 1.45; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
input[type="search"] {
  font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--rule);
  border-radius: 6px; padding: 7px 10px; width: 15rem; max-width: 100%;
}
input[type="search"]:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: 500 12px/1 var(--display); color: var(--muted); background: transparent; border: 1px solid var(--rule);
  border-radius: 999px; padding: 6px 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center;
}
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
.chip svg { width: 10px; height: 10px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
@media (max-width: 960px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.map { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; overflow-x: auto; min-width: 0; }
.map svg { display: block; }
.band-label { font: 600 11px var(--display); letter-spacing: 0.08em; text-transform: uppercase; fill: var(--muted); }
.band-count { font: 400 11px var(--mono); fill: var(--muted); }
.edge { fill: none; stroke: var(--edge); stroke-width: 0.7; opacity: 0.28; }
.edge.on { stroke: var(--accent); stroke-width: 1.4; opacity: 0.85; }
.edge.off { opacity: 0.05; }
.node { cursor: pointer; }
.node .mark { stroke: var(--ink); stroke-width: 1.3; }
.node.decided .mark { fill: var(--ink); }
.node.proposed .mark { fill: var(--panel); }
.node.proposed .core { fill: var(--ink); }
.node.open .mark { fill: var(--panel); stroke: var(--open); stroke-width: 1.8; }
.node.off { opacity: 0.14; }
.node.hit .halo { fill: var(--accent-soft); }
.node.sel .halo { fill: none; stroke: var(--accent); stroke-width: 2; }
.node .halo { fill: transparent; }
.sel-label { font: 500 11px var(--mono); fill: var(--accent); paint-order: stroke; stroke: var(--panel); stroke-width: 4px; }
.tip {
  position: fixed; pointer-events: none; z-index: 20; max-width: 320px; background: var(--ink); color: var(--bg);
  border-radius: 6px; padding: 7px 9px; font-size: 12px; line-height: 1.4;
}
.tip b { font-family: var(--mono); font-weight: 500; }
aside { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 16px; min-width: 0; }
.eyebrow { font: 600 11px var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.nid { font: 500 13px var(--mono); }
.title { font-size: 17px; font-weight: 600; line-height: 1.35; margin: 6px 0 10px; text-wrap: balance; }
.meta { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0 0 12px; font-size: 13px; }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 500 12px var(--display); }
.pill svg { width: 10px; height: 10px; }
.note { font-size: 13px; line-height: 1.5; color: var(--ink); background: var(--band); border-radius: 6px; padding: 8px 10px; margin: 0 0 12px; }
.note .k { color: var(--muted); font-weight: 600; }
h3 { font-size: 13px; margin: 16px 0 6px; display: flex; justify-content: space-between; }
h3 span { font: 400 12px var(--mono); color: var(--muted); }
.group { margin: 0 0 8px; }
.group .lvl { font: 600 10px var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 6px 0 2px; }
.item {
  display: grid; grid-template-columns: 12px auto 1fr; gap: 6px; align-items: baseline; width: 100%; text-align: left;
  font: inherit; font-size: 13px; color: var(--ink); background: none; border: 0; padding: 3px 4px; border-radius: 4px; cursor: pointer;
}
.item:hover { background: var(--band); }
.item .nid { font-size: 12px; }
.item .t { color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item svg { width: 9px; height: 9px; }
.more { font: inherit; font-size: 12px; color: var(--accent); background: none; border: 0; padding: 2px 4px; cursor: pointer; }
.summary { display: grid; gap: 6px; margin-top: 10px; }
.srow { display: grid; grid-template-columns: 92px 1fr 34px; gap: 8px; align-items: center; font-size: 12px; }
.srow .bar { display: flex; height: 8px; border-radius: 2px; overflow: hidden; background: var(--band); }
.srow .bar i { display: block; height: 100%; }
.srow .n { font-family: var(--mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; color: var(--muted); font-size: 12px; margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { width: 10px; height: 10px; }
p.hint { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0; }
@media (prefers-reduced-motion: no-preference) { .node, .edge { transition: opacity 160ms ease; } }
</style>

d from Patrick's use-case instances, 2026-10-31 (workstreams/access-control/USE-CASE-INSTANCES.md).", "options": [{"id": "yes", "label": "Confirm as stated"}, {"id": "no", "label": "Something differs"}]}, {"id": "C1", "level": "need", "title": "Who decides the access settings for newly uploaded data?", "owner": "leadership", "status": "open", "parents": ["ST-4.1"], "source": "research/formalization/INN_use_case_decisions.pdf#C1", "options": [{"id": "uploader", "label": "The person uploading it."}, {"id": "project", "label": "The project's default settings."}, {"id": "terms", "label": "The conditions attached to the data, such as its agreement or sensitivity."}]}, {"id": "C2", "level": "need", "title": "Who can read access records in this release?", "owner": "leadership", "status": "decided", "parents": ["ST-4.1", "UC-5.5"], "source": "research/formalization/INN_use_case_decisions.pdf#C2", "decided": {"date": "2026-11-01", "by": "patrick (2026-11-01, in chat)", "answer": "Administrators and data owners (for their own data), and any change to the records can be detected.", "option": "tamper"}, "options": [{"id": "admins", "label": "Administrators."}, {"id": "owners", "label": "Data owners too, for their own data."}, {"id": "tamper", "label": "As above, and any change to the records can be detected."}, {"id": "later", "label": "None needed for this release."}]}, {"id": "C3", "level": "need", "title": "When the file list is filtered, what can be selected for download or delete?", "owner": "leadership", "status": "decided", "parents": ["UC-5.1"], "source": "research/formalization/INN_use_case_decisions.pdf#C3", "decided": {"date": "2026-10-30", "by": "patrick", "answer": "Selecting a folder selects only the files in it that the filter shows.", "option": "shownin"}, "options": [{"id": "filesonly", "label": "Only the files shown. Folders can't be selected while filtering (the fix in review)."}, {"id": "shownin", "label": "Selecting a folder selects only the files in it tha l": "No automatic end, but administrators are reminded to review."}]}, {"id": "D1", "level": "need", "title": "How does identifiable data move between INN and ImageTech?", "owner": "leadership", "status": "decided", "parents": ["UC-5.1"], "source": "research/formalization/INN_use_case_decisions.pdf#D1", "decided": {"date": "2026-11-01", "by": "patrick (2026-11-01, in chat)", "answer": "All three: machine to machine started through the portal, by staff outside the portal, and through the portal by download and upload. Design a staging area and a pipeline-outputs area on each machine, with rules written for that machine's administrators on which direct changes the portal handles and which carry no guarantees."}, "options": [{"id": "direct", "label": "Directly from one machine to the other, started through the portal."}, {"id": "outside", "label": "By staff, outside the portal, as now."}, {"id": "viauser", "label": "Through the portal by download and upload."}]}, {"id": "D2", "level": "need", "title": "Who counts as an outside collaborator?", "owner": "leadership", "status": "open", "parents": ["ST-4.2"], "source": "research/formalization/INN_use_case_decisions.pdf#D2", "options": [{"id": "guest", "label": "Someone given a guest account when invited."}, {"id": "fed", "label": "Someone who signs in through their own institution."}, {"id": "link", "label": "Anyone holding the link or access code. No identity is recorded."}]}, {"id": "D3", "level": "need", "title": "When can files leave the POSIX machines?", "owner": "leadership", "status": "decided", "parents": ["ST-4.5"], "source": "research/formalization/INN_use_case_decisions.pdf#D3", "decided": {"date": "2026-11-01", "by": "patrick (2026-11-01, in chat)", "answer": "Only if the conditions attached to the file allow.", "option": "terms"}, "options": [{"id": "any", "label": "Any file can be downloaded."}, {"id": "terms", "label": "Only if the conditions attached to it allow."}, {"id": "approve", "label": "Only after someone approves it."}]}, {"id": "D4", "level": "need", "title": "What conditions apply to results uploaded back?", "owner": "leadership", "status": "open", "parents": ["ST-4.3", "UC-5.5"], "source": "research/formalization/INN_use_case_decisions.pdf#D4", "options": [{"id": "none", "label": "None. Results belong to the person who made them."}, {"id": "all", "label": "All the conditions of every dataset that went into them."}, {"id": "relax", "label": "All the conditions, unless an approved step (for example, aggregation) relaxes them."}]}, {"id": "D5", "level": "need", "title": "Who may see results made from protected data?", "owner": "leadership", "status": "open", "parents": ["ST-4.3", "ST-4.5"], "source": "research/formalization/INN_use_case_decisions.pdf#D5", "options": [{"id": "self", "label": "Only the researcher who made them."}, {"id": "sources", "label": "Anyone with access to all the data that went in."}, {"id": "terms", "label": "Whoever the conditions attached to the results allow."}]}, {"id": "D6", "level": "need", "title": "What counts as a copy of data?", "owner": "leadership", "status": "open", "parents": ["ST-4.6", "UC-5.4"], "source": "research/formalization/INN_use_case_decisions.pdf#D6", "options": [{"id": "data", "label": "Saved copies of the data itself."}, {"id": "results", "label": "Also results made from it."}, {"id": "all", "label": "Also temporary files, backups and log entries that identify it."}]}, {"id": "D7", "level": "need", "title": "May access records contain identifying details?", "owner": "leadership", "status": "decided", "parents": ["UC-5.4"], "source": "research/formalization/INN_use_case_decisions.pdf#D7", "decided": {"date": "2026-11-01", "by": "patrick (2026-11-01, in chat)", "answer": "Records may hold names as they are. Coding participant IDs in file names is the study team's responsibility; the portal doesn't enforce it for now. Enforcement rules can come later if needed.", "option": "yes"}, "options": [{"id": "yes", "label": "Yes, they may identify the data and the people involved."}, {"id": "coded", "label": "No, only coded references that can't identify anyone on their own."}]}, {"id": "D8", "level": "need", "title": "If a participant withdraws consent, what has to be removed?", "owner": "leadership", "status": "decided", "parents": ["UC-5.7"], "source": "research/formalization/INN_use_case_decisions.pdf#D8", "decided": {"date": "2026-11-01", "by": "patrick (2026-11-01, in chat)", "answer": "Any combination of original data, derived data and identifying log entries, as the case requires: the portal supports each, and the consent or agreement decides which apply."}, "options": [{"id": "data", "label": "Their original data."}, {"id": "derived", "label": "Also everything made from it."}, {"id": "logs", "label": "Also log entries that identify them."}]}, {"id": "D9", "level": "need", "title": "Does de-identifying data change the conditions that apply to it?", "owner": "leadership", "status": "decided", "parents": ["ST-4.7"], "source": "research/formalization/INN_use_case_decisions.pdf#D9", "decided": {"date": "2026-11-01", "by": "patrick (2026-11-01, in chat)", "answer": "An approved de-identification step can relax the conditions.", "option": "yes"}, "options": [{"id": "no", "label": "No. De-identified data keeps the original conditions."}, {"id": "yes", "label": "Yes. An approved de-identification step can relax them."}]}, {"id": "PRIV-1", "level": "need", "title": "Do consent forms or agreements name who must hold or control participants' data?", "owner": "privacy", "status": "open", "parents": ["UC-5.1"], "source": "research/formalization/INN_use_case_decisions.pdf#A1", "notes": "Asked in A1's 'Before answering'; privacy office or ethics board."}, {"id": "PRIV-2", "level": "need", "title": "Privacy impact assessment for bringing identifiable data into the portal", "owner": "privacy", "status": "open", "parents": ["UC-5.1"], "source": "research/formalization/INN_use_case_decisions.p #AC-3"}, {"id": "AC-4", "level": "requirement", "title": "A bulk action acts only on the selected items; under a filter, only what the filter shows", "owner": "leadership", "status": "decided", "parents": ["UC-5.1", "C3"], "source": "INN-Data-Portal/docs/requirements/access-control.md#AC-4"}, {"id": "AC-5", "level": "requirement", "title": "A permission names a single file, or a folder and everything in it; literal path", "owner": "leadership", "status": "decided", "parents": ["ST-4.1", "ST-2.4", "B1"], "source": "INN-Data-Portal/docs/requirements/access-control.md#AC-5"}, {"id": "AC-6", "level": "requirement", "title": "Permissions can be limited to files of a given type", "owner": "leadership", "status": "decided", "parents": ["ST-2.4", "C4"], "source": "INN-Data-Portal/docs/requirements/access-control.md#AC-6"}, {"id": "AC-7", "level": "requirement", "title": "New access to a withdrawn participant's data is blocked", "owner": "leadership", "status": "open", "parents": ["UC-5.7", "ST-4.7", "D8"], "source": "INN-Data-Portal/docs/requirements/access-control.md#AC-7"}, {"id": "AC-8", "level": "requirement", "title": "Access can expire with the agreement that grants it", "owner": "leadership", "status": "decided", "parents": ["ST-2.4", "UC-5.8", "C6"], "source": "INN-Data-Portal/docs/requirements/access-control.md#AC-8"}, {"id": "AC-9", "level": "requirement", "title": "Every access is logged and attributable to a user", "owner": "leadership", "status": "open", "parents": ["UC-5.1", "C2", "D7"], "source": "INN-Data-Portal/docs/requirements/access-control.md#AC-9"}, {"id": "PX-1", "level": "requirement", "title": "Browse, download and upload on a connected POSIX machine", "owner": "leadership", "status": "decided", "parents": ["ST-4.1"], "source": "INN-Data-Portal-posix/docs/requirements/posix-storage.md#PX-1"}, {"id": "PX-2", "level": "requirement", "title": "Delete on a connected POSIX machine", "owner": "leadership", "status": "decided", "parents": ["ST-4.1"], "source": "INN-Data-Portal-posix/docs/requirements/posix-storage.md#PX-2", "decided": {"date": "2026-11-01", "by": "patrick (2026-11-01, in chat)", "answer": "Confirmed as written."}}, {"id": "PX-3", "level": "requirement", "title": "Same answers on POSIX as on object storage", "owner": "leadership", "status": "decided", "parents": ["ST-4.1", "UC-5.1"], "source": "INN-Data-Portal-posix/docs/requirements/posix-storage.md#PX-3"}, {"id": "PX-4", "level": "requirement", "title": "Identifiable data on INN/ImageTech machines, scrubbed there; only scrubbed data leaves", "owner": "leadership", "status": "open", "parents": ["UC-5.1", "ST-4.7", "D3"], "source": "INN-Data-Portal-posix/docs/requirements/posix-storage.md#PX-4"}, {"id": "PX-5", "level": "requirement", "title": "An interrupted download resumes", "owner": "leadership", "status": "decided", "parents": ["UC-5.8", "ST-4.1"], "source": "INN-Data-Portal-posix/docs/requirements/posix-storage.md#PX-5", "decided": {"date": "2026-11-01", "by": "patrick (2026-11-01, in chat)", "answer": "Confirmed as written."}}, {"id": "PX-6", "level": "requirement", "title": "An upload is complete or absent", "owner": "leadership", "status": "decided", "parents": ["UC-5.1"], "source": "INN-Data-Portal-posix/docs/requirements/posix-storage.md#PX-6", "decided": {"date": "2026-11-01", "by": "patrick (2026-11-01, in chat)", "answer": "Confirmed, extended: a file appears at its path only when complete; an interrupted upload can resume and is shown as incomplete until it does; unfinished uploads are cleared after a set time."}}, {"id": "PX-7", "level": "requirement", "title": "File contents don't pass through the portal's servers", "owner": "leadership", "status": "decided", "parents": ["UC-5.8"], "source": "INN-Data-Portal-posix/docs/requirements/posix-storage.md#PX-7", "decided": {"date": "2026-11-01", "by": "patrick (2026-11-01, in chat)", "answer": "Confirmed as written."}}, {"id": "PX-8", "level": "requirement", "title": "Works without admin access; admin used only where a requirement needs it", "owner": "leadership", "status": "proposed", "parents": ["A1", "A2", "A3"], "source": "INN-Data-Portal-posix/docs/requirements/posix-storage.md#PX-8"}, {"id": "PX-9", "level": "requirement", "title": "Who decides who can open governed files, per machine", "owner": "leadership", "status": "proposed", "parents": ["UC-5.1", "A1"], "source": "INN-Data-Portal-posix/docs/requirements/posix-storage.md#PX-9"}, {"id": "PX-10", "level": "requirement", "title": "Activity on POSIX data is recorded as A2 decides", "owner": "leadership", "status": "open", "parents": ["ST-4.1", "UC-5.1", "A2", "AC-9"], "source": "INN-Data-Portal-posix/docs/requirements/posix-storage.md#PX-10"}, {"id": "PX-11", "level": "requirement", "title": "Direct changes on a machine appear within A3's time", "owner": "leadership", "status": "open", "parents": ["ST-4.1", "A3"], "source": "INN-Data-Portal-posix/docs/requirements/posix-storage.md#PX-11"}, {"id": "PX-12", "level": "requirement", "title": "Identifiable data moves between INN and ImageTech as D1 decides", "owner": "leadership", "status": "open", "parents": ["UC-5.1", "ST-4.7", "D1"], "source": "INN-Data-Portal-posix/docs/requirements/posix-storage.md#PX-12"}, {"id": "PX-13", "level": "requirement", "title": "Several files download as one resumable archive", "owner": "leadership", "status": "decided", "parents": ["ST-4.1", "UC-5.8"], "source": "INN-Data-Portal-posix/docs/requirements/posix-storage.md#PX-13", "decided": {"date": "2026-11-01", "by": "patrick (2026-11-01, in chat)", "answer": "Confirmed as written."}}, {"id": "PX-14", "level": "requirement", "title": "A multi-file download leaves no copy anywhere but the machine", "owner": "leadership", "status": "proposed", "parents": ["UC-5.1", "ST-4.7", "PX-4"], "source": "INN-Data-Portal-posix/docs/requirements/posix-storage.md#PX-14"}, {"id": "PX-15", "level": "requirement", "title": "A study-sized upload completes however long it takes", "owner" cation)", "owner": "leadership", "status": "decided", "parents": ["ST-4.1", "ST-4.5", "ST-4.7"], "source": "documents/inn-digital-infrastructure-strategy/INN_Digital_Infrastructure_Strategy_2026.pdf", "decided": {"date": "2026-11-01", "by": "patrick (2026-11-01, in chat)", "answer": "Adopt: the portal supports preparing a dataset for release (curation, BIDS conversion, de-identification)."}, "notes": "Proposed 2026-10-30 (red in the strategy); leadership adopts or not."}, {"id": "STD-WHICH", "level": "need", "title": "Which data standards does the platform validate and understand?", "owner": "leadership", "status": "open", "parents": ["UC-5.1", "UC-5.9"], "source": "documents/inn-digital-infrastructure-strategy/INN_Digital_Infrastructure_Strategy_2026.pdf", "notes": "Class question: answers accumulate (BIDS proposed first).", "options": [{"id": "bids", "label": "BIDS"}]}, {"id": "STD-1", "level": "requirement", "title": "Data declared as BIDS is validated on upload; failures are held in quarantine", "owner": "leadership", "status": "open", "parents": ["UC-5.1", "STD-WHICH", "STD-QUARANTINE"], "source": "INN-Data-Portal/docs/requirements/data-standards.md#STD-1"}, {"id": "STD-2", "level": "requirement", "title": "Preparing a release records conversion and de-identification as provenance; the source stays on the governed machine", "owner": "leadership", "status": "open", "parents": ["UC-5.9", "D9", "PX-4"], "source": "INN-Data-Portal/docs/requirements/data-standards.md#STD-2"}, {"id": "FEAT-standards", "level": "feature", "title": "Datasets checked against declared standards", "owner": "leadership", "status": "open", "parents": ["STD-1", "STD-2"], "source": "documents/inn-digital-infrastructure-strategy/INN_Digital_Infrastructure_Strategy_2026.pdf"}, {"id": "DS-standard-seam", "level": "design", "title": "One validation seam: a dataset declares its standard; a validator per standard plugs in", "owner": "patrick", "status": "proposed", "parents": ["FEAT-standards", "STD-1"], "source": "documents/inn-digital-infrastructure-strategy/INN_Digital_Infrastructure_Strategy_2026.pdf", "robust_to": ["STD-WHICH", "STD-QUARANTINE"]}, {"id": "CODE-bids-validator", "level": "code", "title": "BIDS validator behind the seam (bids-validator)", "owner": "patrick", "status": "proposed", "parents": ["FEAT-standards", "DS-standard-seam", "CODE-standard-seam"], "source": "documents/inn-digital-infrastructure-strategy/INN_Digital_Infrastructure_Strategy_2026.pdf", "branch": "feat/bids-validator", "notes": "bids-validator 1.14.7.post0 (MIT; schema via bidsschematools 2.0.1) checks paths only. Seen end to end 2026-10-31 on the local stack (merged onto the authz stack): a 5-file session with one misnamed scan came back quarantined, naming it. Strategy 5.1 step 3 stays known-failing: it also needs consent validation.", "assumes": [{"node": "STD-WHICH", "answer": "BIDS is supported", "if_wrong": "remove the BIDS validator; the seam stays", "options": ["bids"], "decided_as": "BIDS", "outcome": "won"}]}, {"id": "DS-standard-generalize", "level": "design", "title": "Generalize the validation seam for a second standard", "owner": "patrick", "status": "open", "parents": ["DS-standard-seam"], "source": "documents/inn-digital-infrastructure-strategy/INN_Digital_Infrastructure_Strategy_2026.pdf", "robust_to": ["STD-QUARANTINE"], "deferred": {"why": "one standard can't show what varies", "until": {"node": "STD-WHICH", "count_at_least": 2}}}, {"id": "NT-NOTIFY", "level": "need", "title": "How is a researcher told about their data (stored, failed validation, held)?", "owner": "leadership", "status": "decided", "parents": ["UC-5.1"], "source": "documents/inn-digital-infrastructure-strategy/INN_Digital_Infrastructure_Strategy_2026.pdf", "decided": {"date": "2026-10-30", "by": "patrick", "answer": "Both", "option": "both"}, "options": [{"id": "inapp", "label": "In the portal"}, {"id": "email", "label": "By email"}, {"id": "both", "label": "Both"}]}, {"id": "NT-1", "level": "requirement", "title": "The researcher is told when their upload is stored, and what failed if it wasn't", "owner": "leadership", "status": "decided", "parents": ["UC-5.1", "NT-NOTIFY"], "source": "INN-Data-Portal/docs/requirements/notifications.md#NT-1", "decided": {"date": "2026-11-01", "by": "patrick (2026-11-01, in chat)", "answer": "Confirmed as written."}}, {"id": "FEAT-notifications", "level": "feature", "title": "Notifications to researchers", "owner": "leadership", "status": "open", "parents": ["NT-1"], "source": "documents/inn-digital-infrastructure-strategy/INN_Digital_Infrastructure_Strategy_2026.pdf"}, {"id": "DS-notify-seam", "level": "design", "title": "Notifications recorded per user in the portal; delivery channels plug in", "owner": "patrick", "status": "decided", "parents": ["FEAT-notifications", "NT-1"], "source": "documents/inn-digital-infrastructure-strategy/INN_Digital_Infrastructure_Strategy_2026.pdf", "decided": {"date": "2026-10-30", "by": "agent", "answer": "In-app store per user (MongoDB, like bundle records), channels pluggable; works whichever channel NT-NOTIFY picks"}, "robust_to": ["NT-NOTIFY"]}, {"id": "CODE-notify-stored", "level": "code", "title": "Upload completion (file and folder) records a notification; GET /api/notifications/", "owner": "patrick", "status": "proposed", "parents": ["FEAT-notifications", "DS-notify-seam"], "source": "documents/inn-digital-infrastructure-strategy/INN_Digital_Infrastructure_Strategy_2026.pdf", "branch": "feat/notifications", "robust_to": ["NT-NOTIFY"]}, {"id": "SA-MAIL", "level": "constraint", "title": "A mail relay the portal can send through (host, port, sender address)", "owner": "sysadmins", "status": "open", "parents": [], "source": "documents/inn-digital-infrastructure-strategy/INN_Digital_Infrastructure_Strategy_2026.pdf"}, {"id": "CODE-notify-email", "level": "code", "title": "Email channel for notifications (no file names in the message; off until a relay is set)", "owner": "patrick", "status": "proposed", "parents": ["FEAT-notifications", "DS-notify-seam", "SA-MAIL"], "source": "documents/inn-digital-infrastructure-strategy/INN_Digital_Infrastructure_Strategy_2026.pdf", "branch": "feat/notifications", "robust_to": ["SA-MAIL"]}, {"id": "CODE-notify-ui", "level": "code", "title": "Notifications shown in the portal", "owner": "patrick", "status": "proposed", "parents": ["FEAT-notifications", "DS-notify-seam"], "source": "documents/inn-digital-infrastructure-strategy/INN_Digital_Infrastructure_Strategy_2026.pdf", "branch": "feat/notifications"}, {"id": "REWORK-MR-165-C3", "level": "code", "title": "Rework MR-165: allow a folder whose own name matches the filter: restore the longer fix kept in stash@{0} on bug/INN-295-filtered-selection", "owner": "team", "status": "proposed", "parents": ["MR-165"], "source": "workstreams/access-control/STATUS.md", "branch": "bug/INN-295-filtered-selection", "robust_to": ["C3"]}, {"id": "DT-WITHDRAW-RUNNING", "level": "need", "title": "Should withdrawing access or consent stop a download that's already running?", "owner": "privacy", "status": "open", "parents": ["UC-5.7", "ST-4.7"], "source": "workstreams/posix-storage/STREAMING-SPEC.md", "notes": "Raised 2026-10-31: studies of 10-100 GB mean a download can run hours to a day. Holds for long downloads are paused on this (stash on posix/stack).", "options": [{"id": "finish", "label": "No: a started download finishes (as decided 2026-10-22), within a limit"}, {"id": "stop", "label": "Yes: withdrawal stops running downloads straight away"}]}, {"id": "DT-PY-BUNDLER", "level": "design", "title": "Retire the Python bundler and the BUNDLER_PROVIDER switch (Java is the default)?", "owner": "team", "status": "decided", "parents": ["FEAT-bundle-security"], "source": "workstreams/data-transfer/STATUS.md", "decided": {"date": "2026-10-31", "by": "patrick", "answer": "Retire the Python bundler and BUNDLER_PROVIDER; the Java bundler is the only one"}, "notes": "Bundler review 2026-10-31: Python duplicates job lifecycle, its same-request deduplication would give two users one bundle ID (clashes with INN-272's one owner per bundle), and its download path looks broken under the current backend (inferred, not run).", "robust_to": []}, {"id": "CODE-retire-py-bundler", "level": "code", "title": "Retire the Python bundler and the BUNDLER_PROVIDER switch", "owner": "team", "status": "proposed", "parents": ["DT-PY-BUNDLER"], "source": "workstreams/data-transfer/STATUS.md", "branch": "chore/retire-python-bundler", "notes": "Checked 2026-10-31 merged onto bug/INN-272-recheck: access-control HTTP suite 25 passed, 2 xfailed (INN-294's), the same as the branch alone; its bundle tests go through the Java bundler. The staging Nomad service bundler-staging keeps running until the team stops it. posix/stack's local/docker-compose.posix.yaml still sets BUNDLER_PROVIDER (harmless; drop on the next restack)."}, {"id": "STD-QUARANTINE", "level": "need", "title": "What does quarantine hold back when uploaded data fails its standard's checks?", "owner": "leadership", "status": "open", "parents": ["UC-5.1"], "source": "INN-Data-Portal/docs/requirements/data-standards.md#STD-1", "options": [{"id": "shown", "label": "Nothing: the failure is recorded and shown to the researcher and administrators."}, {"id": "others", "label": "Everyone but the uploader and administrators can't see or download it until it's fixed."}, {"id": "all", "label": "Nobody can download or share it until it's fixed."}]}, {"id": "DS-standard-declared", "level": "design", "title": "A folder declares its standard by the standard's own marker file at its root (BIDS: dataset_description.json)", "owner": "patrick", "status": "decided", "parents": ["DS-standard-seam"], "source": "INN-Data-Portal/docs/requirements/data-standards.md#STD-1", "decided": {"date": "2026-10-31", "by": "agent", "answer": "BIDS datasets already carry dataset_description.json at their root (required by the specification); using each standard's own marker needs no portal-specific flag and works for files placed directly on the machine"}, "robust_to": ["STD-WHICH", "STD-QUARANTINE"]}, {"id": "DS-standard-names-first", "level": "design", "title": "First checks read names and layout from the file tree only; content checks run where the data is, later", "owner": "patrick", "status": "decided", "parents": ["DS-standard-seam"], "source": "INN-Data-Portal/docs/requirements/data-standards.md#STD-1", "decided": {"date": "2026-10-31", "by": "agent", "answer": "Names and layout are in the file tree, so checking them moves no file contents (PX-7) and runs in the request; sidecar and header checks need the bytes and belong beside the data"}, "robust_to": ["STD-WHICH", "STD-QUARANTINE"]}, {"id": "CODE-standard-seam", "level": "code", "title": "Validation seam: declared datasets checked when an upload completes; result recorded, quarantine as a state", "owner": "patrick", "status": "proposed", "parents": ["FEAT-standards", "DS-standard-seam", "DS-standard-declared", "DS-standard-names-first"], "source": "INN-Data-Portal/docs/requirements/data-standards.md#STD-1", "branch": "feat/standard-seam", "notes": "Conflicts with feat/notifications in one place: the single-file upload's return line (this adds checks; notifications adds a notification just before it). Resolution keeps both.", "robust_to": ["STD-WHICH", "STD-QUARANTINE"]}, {"id": "CODE-standard-content", "level": "code", "title": "Content checks (sidecars, image headers) run on the storage machine", "owner": "patrick", "status": "open", "parents": ["FEAT-standards", "CODE-standard-seam"], "source": "INN-Data-Portal/docs/requirements/data-standards.md#STD-1", "deferred": "names and layout first; content checks need code beside the data (PX-7)"}, {"id": "CODE-tls-in-service", "level": "code", "title": "File service serves HTTPS itself (GATEWAY_TLS_CERT, GATEWAY_TLS_KEY)", "owner": "patrick", "status": "proposed", "parents": ["FEAT-posix-access", "DS-tls-in-service"], "source": "workstreams/posix-storage/MR-STACK.md", "branch": "posix/stack"}, {"id": "DS-policy-from-selection", "level": "design", "title": "Grant by choosing from the file tree: fixed mapping from selection to rules, previewed in plain words, through the policy API", "owner": "patrick", "status": "decided", "parents": ["FEAT-authz", "AC-4", "AC-5"], "source": "workstreams/access-control/USE-CASE-INSTANCES.md", "decided": {"date": "2026-10-31", "by": "agent", "answer": "As in USE-CASE-INSTANCES.md 'Choosing from the file tree': a ticked folder (no filter) is folder/*; files one rule each, never collapsed; under a filter one rule per shown file; previewed in plain words; saved one POST per rule through the policy API"}}, {"id": "DS-move-prompt", "level": "design", "title": "Offer to carry access over when a file is moved or renamed", "owner": "patrick", "status": "open", "parents": ["R-RENAME"], "source": "workstreams/access-control/USE-CASE-INSTANCES.md", "deferred": "access is by name for now (use-case instance 4); a prompt may come later"}, {"id": "DOC-policy-guide", "level": "doc", "title": "Giving people access (for administrators and project managers)", "owner": "patrick", "status": "proposed", "parents": ["AC-1", "AC-10", "AC-4", "AC-5", "FEAT-authz"], "source": "INN-Data-Portal/docs/user-guide/policies.md"}, {"id": "CODE-policy-from-selection", "level": "code", "title": "Policy form: choose the resource from the file tree; ticks become per-file or folder rules, previewed, saved through the policy API", "owner": "patrick", "status": "proposed", "parents": ["DS-policy-from-selection"], "source": "INN-Data-Portal/frontend/src/components/admin_page/policy_management/treeRules.js", "branch": "feat/policy-from-selection", "notes": "Merged into GitHub development 2026-10-31."}, {"id": "DOC-getting-started", "level": "doc", "title": "Getting started: signing in, and what researchers and administrators see", "owner": "patrick", "status": "proposed", "parents": ["AC-1", "AC-5", "FEAT-authz"], "source": "INN-Data-Portal/docs/user-guide/getting-started.md", "branch": "docs/user-guide-pages"}, {"id": "DOC-downloading", "level": "doc", "title": "Finding and downloading files", "owner": "patrick", "status": "proposed", "parents": ["AC-3", "AC-4", "FEAT-authz"], "source": "INN-Data-Portal/docs/user-guide/downloading.md", "branch": "docs/user-guide-pages"}, {"id": "DOC-uploading", "level": "doc", "title": "Uploading files and folders", "owner": "patrick", "status": "proposed", "parents": ["AC-2", "AC-3", "FEAT-authz"], "source": "INN-Data-Portal/docs/user-guide/uploading.md", "branch": "docs/user-guide-pages"}, {"id": "DOC-deleting", "level": "doc", "title": "Deleting files", "owner": "patrick", "status": "proposed", "parents": ["AC-2", "AC-4", "FEAT-authz"], "source": "INN-Data-Portal/docs/user-guide/deleting.md", "branch": "docs/user-guide-pages"}, {"id": "DOC-notifications", "level": "doc", "title": "Notifications: being told when an upload is stored", "owner": "patrick", "status": "proposed", "parents": ["AC-8", "NT-1"], "source": "INN-Data-Portal/docs/user-guide/notifications.md", "branch": "docs/user-guide-pages"}, {"id": "DOC-administering", "level": "doc", "title": "Storage, projects and users (for administrators and project managers)", "owner": "patrick", "status": "proposed", "parents": ["AC-5", "FEAT-authz"], "source": "INN-Data-Portal/docs/user-guide/administering.md", "branch": "docs/user-guide-pages"}, {"id": "DOC-how-access-works", "level": "doc", "title": "How access works: what each policy allows (reference)", "owner": "patrick", "status": "proposed", "parents": ["AC-1", "AC-10", "AC-2", "AC-3", "AC-4", "AC-5", "AC-6", "AC-8", "FEAT-authz"], "source": "INN-Data-Portal/docs/user-guide/how-access-works.md", "branch": "docs/user-guide-structure"}, {"id": "DS-effective-access-view", "level": "design", "title": "Show who has access beside each file and folder (the access that results, not the rules)", "owner" n this person do this action on this path, and which policy allows it", "owner": "patrick", "status": "decided", "parents": ["AC-1", "AC-3", "FEAT-authz"], "source": "workstreams/access-control/CHECK-ACCESS.md", "decided": {"date": "2026-11-02", "by": "agent", "answer": "GET /api/policies/check and a Check Access panel; answered by Checker with the policies that allow it (rules.covering); scoped like policy listing."}}, {"id": "DS-policy-reason", "level": "design", "title": "Record why each policy exists (a reason field on the policy)", "owner": "patrick", "status": "open", "parents": ["FEAT-authz"], "source": "workstreams/data-transfer/reports/Explaining access rules to users.md"}, {"id": "CODE-rename-and-link-tests", "level": "code", "title": "Tests for access by name (rename and move) and for download-link expiry, which the guide states without a test", "owner": "patrick", "status": "proposed", "parents": ["FEAT-authz"], "source": "workstreams/data-transfer/reports/Explaining access rules to users.md", "branch": "test/access-by-name-and-links", "notes": "Merged into GitHub development 2026-11-02. A portal sync only adds and updates, so a renamed file's old entry stays in the tree until removed by hand."}, {"id": "AC-10", "level": "requirement", "title": "A permission on a folder can exclude named files or folders inside it", "owner": "leadership", "status": "decided", "parents": ["ST-2.4", "C5"], "source": "INN-Data-Portal/docs/requirements/access-control.md#AC-10", "notes": "Settled by C5 (Patrick, 2026-11-01). Not built; changes the 'policies only add up' model in the user guide when it is."}, {"id": "DS-policy-conditions", "level": "design", "title": "Policy conditions: one optional field read only by rules.py (exclusions, file types, end dates)", "owner": "patrick", "status": "decided", "parents": ["AC-6", "AC-8", "AC-10", "FEAT-authz", "AC-11"], "source": "workstreams/access-control/POLICY-CONDITIONS.md", "decided": {"date": "2026-11-01", "by": "patrick (exc oject that includes the instance (as end-date reminders); if owners are per dataset, only the read filter changes. AC-7 erasure and PX-10 machine records arrive through the same writer.", "robust_to": ["AR-SCOPE", "AR-RETAIN", "AR-ANCHOR", "AR-CEPH-GET", "D6"], "one_way": "The hashing scheme (what each digest covers, the canonical form) is fixed once records exist: changing it means verifying old records under the old scheme forever. Patrick reviews it before code."}, {"id": "CODE-policy-store-reads", "level": "code", "title": "Policies read and written in MongoDB, not Casbin's in-memory copy (stale across backend processes; misreads '[')", "owner": "patrick", "status": "proposed", "parents": ["FEAT-authz"], "source": "INN-Data-Portal/backend/core/services/policies/casbin/CasbinPolicyManager.py", "branch": "fix/policy-listings-from-store", "notes": "Merged into GitHub development 2026-11-02. Found while planning the who-has-access view: on development a policy on a path with '[' made the policies listing fail (500)."}, {"id": "CODE-check-access", "level": "code", "title": "Check a person's access, and which of their policies allows it", "owner": "patrick", "status": "proposed", "parents": ["DS-check-access"], "source": "INN-Data-Portal/backend/api/v0_1/endpoints/policies.py", "branch": "feat/check-access", "notes": "Merged into GitHub development 2026-11-02."}, {"id": "DOC-checking-access", "level": "doc", "title": "User guide: Checking someone's access", "owner": "patrick", "status": "proposed", "parents": ["AC-1", "AC-3"], "source": "INN-Data-Portal/docs/user-guide/checking-access.md"}, {"id": "ST-7.1", "level": "goal", "title": "Proposal A: infrastructure that follows research relationships (a proposal for discussion)", "owner": "leadership", "status": "open", "parents": ["ST-0"], "source": "documents/inn-digital-infrastructure-strategy/INN_Digital_Infrastructure_Strategy_2026.pdf#7.1", "notes": "In the strategy's 'Proposals for Discussion': not adopted. Correspondence, researcher-driven, bounded delegation, relationship lifecycles, legibility, governance sets the bounds."}, {"id": "REL-MEMBERSHIP-ACCESS", "level": "need", "title": "Does project membership confer access, and who may create a project's grants?", "owner": "leadership", "status": "open", "parents": ["ST-7.1"], "source": "workstreams/access-control/RELATIONSHIPS.md#questions", "options": [{"id": "stewards", "label": "Yes; administrators or stewards create a project's grants, managers manage its membership."}, {"id": "managers", "label": "Yes; managers may also grant within what the project holds."}, {"id": "no", "label": "No; access stays per person, projects only scope administration."}]}, {"id": "REL-REMOVAL-LATENCY", "level": "need", "title": "How soon must removing someone from a project end their access?", "owner": "privacy", "status": "open", "parents": ["ST-7.1"], "source": "workstreams/access-control/RELATIONSHIPS.md#questions", "options": [{"id": "next", "label": "On their next request."}, {"id": "minutes", "label": "Within a few minutes (the sign-in token's life)."}]}, {"id": "REL-PROJECT-NAME", "level": "need", "title": "What is a group that holds data under terms called: project, study, or a study inside a project?", "owner": "patrick", "status": "open", "parents": ["ST-7.1"], "source": "workstreams/access-control/RELATIONSHIPS.md#questions", "options": [{"id": "project", "label": "Project"}, {"id": "study", "label": "Study"}, {"id": "both", "label": "A study inside a project"}]}, {"id": "REL-MEMBERSHIP-STORE", "level": "need", "title": "Where does membership live once it needs roles, dates or approval?", "owner": "team", "status": "open", "parents": ["ST-7.1"], "source": "workstreams/access-control/RELATIONSHIPS.md#coupling", "deferred": "Keycloak groups suffice until studies need per-member roles, membership dates or approval states; the seam (AbstractProjectManager) lets a membership table replace them."}, {"id": "AC-12", "level": "requirement", "title": "Access follows research relationships: membership gives a project's access and leaving ends it", "owner": "leadership", "status": "open", "parents": ["ST-7.1", "REL-MEMBERSHIP-ACCESS"], "source": "INN-Data-Portal/docs/requirements/access-control.md#AC-12"}, {"id": "FEAT-relationship-access", "level": "feature", "title": "Projects hold grants; membership gives access; legibility by relationship", "owner": "patrick", "status": "open", "parents": ["AC-12"], "source": "workstreams/access-control/RELATIONSHIPS.md"}, {"id": "DS-relationship-grants", "level": "design", "title": "A policy's subject may be a project; membership through one seam; cuts first", "owner": "patrick", "status": "proposed", "parents": ["FEAT-relationship-access", "REL-MEMBERSHIP-ACCESS", "REL-REMOVAL-LATENCY", "REL-PROJECT-NAME", "REL-MEMBERSHIP-STORE"], "source": "workstreams/access-control/RELATIONSHIPS.md", "assumes": [{"node": "REL-MEMBERSHIP-ACCESS", "answer": "membership confers access, with project grants created by administrators or stewards", "if_wrong": "steps 2 to 5 aren't built; the cuts (step 1) stand on their own", "options": ["stewards", "managers"]}], "robust_to": ["REL-PROJECT-NAME", "REL-MEMBERSHIP-STORE", "REL-REMOVAL-LATENCY"]}, {"id": "CODE-policy-cuts", "level": "code", "title": "Cut Casbin's enforcer, POST /api/policies/validate, the Agreement stubs and the unused actions list", "owner": "patrick", "status": "proposed", "parents": ["DS-relationship-grants"], "source": "INN-Data-Portal/backend/core/services/policies/casbin/CasbinPolicyManager.py", "branch": "refactor/policy-cuts", "notes": "Merged into GitHub development 2026-11-02 (133 lines out, 34 in). ENFORCER_MODEL is still named by the health check and deployment files; drop it with the team.", "robust_to": ["REL-MEMBERSHIP-ACCESS"]}, {"id": "CODE-manager-scope", "level": "code", "title": "Project managers list only their projects' people; managed_projects is the one membership seam", "owner": "patrick", "status": "proposed", "parents": ["DS-relationship-grants"], "source": "INN-Data-Portal/backend/core/services/projects/abstract_project_manager.py", "branch": "fix/manager-user-scope", "notes": "Merged into GitHub development 2026-11-02. The frontend still reads the token's projects claim to choose the admin screens (display only; the backend enforces).", "robust_to": ["REL-MEMBERSHIP-ACCESS", "REL-REMOVAL-LATENCY"]}, {"id": "CODE-broad-grant-warning", "level": "code", "title": "Say when a policy covers a whole bucket or the whole instance, before it's saved", "owner": "patrick", "status": "proposed", "parents": ["DS-broad-grant-warning"], "source": "INN-Data-Portal/frontend/src/components/admin_page/policy_management/treeRules.js", "branch": "feat/broad-grant-warning"}, {"id": "CODE-typed-policy-preview", "level": "code", "title": "Say a typed policy in plain words, with its conditions, before it's saved", "owner": "patrick", "status": "proposed", "parents": ["DS-grant-extent-preview"], "source": "INN-Data-Portal/frontend/src/components/admin_page/policy_management/treeRules.js", "branch": "feat/typed-policy-preview", "notes": "First half of DS-grant-extent-preview; the file count waits (POLICY-PREVIEW.md).", "robust_to": ["DS-grant-extent-preview"]}], "owners": ["patrick", "leadership", "team", "sysadmins", "rdt", "privacy", "production"], "start": "AC-5"};
const LEVELS = ["goal", "usecase", "need", "requirement", "feature", "constraint", "design", "code", "doc"];
const LEVEL_NAMES = { goal: "Strategy", usecase: "Use cases", need: "Needs", requirement: "Requirements", feature: "Features",
  constraint: "Constraints", design: "Design", code: "Code", doc: "User docs" };
const STATUS = ["decided", "proposed", "open"];
const STATUS_NAMES = { decided: "Decided", proposed: "Proposed", open: "Open" };

const byId = new Map(DATA.nodes.map((n) => [n.id, n]));
const children = new Map(DATA.nodes.map((n) => [n.id, []]));
const edges = [];
for (const n of DATA.nodes) {
  n.parents = n.parents.filter((p) => byId.has(p));
  for (const p of n.parents) { children.get(p).push(n.id); edges.push([p, n.id]); }
}

// Order each band so links cross as little as possible: barycenter sweeps down, then up.
const bands = LEVELS.map((l) => DATA.nodes.filter((n) => n.level === l).map((n) => n.id));
const pos = new Map();
const natural = (a, b) => a.localeCompare(b, undefined, { numeric: true });
bands.forEach((b) => { b.sort(natural); b.forEach((id, i) => pos.set(id, (i + 0.5) / b.length)); });
function sweep(band, neighbours) {
  const score = new Map(band.map((id) => {
    const ns = neighbours(id);
    return [id, ns.length ? ns.reduce((s, x) => s + pos.get(x), 0) / ns.length : pos.get(id)];
  }));
  band.sort((a, b) => score.get(a) - score.get(b) || natural(a, b));
  band.forEach((id, i) => pos.set(id, (i + 0.5) / band.length));
}
for (let k = 0; k < 8; k++) {
  bands.forEach((b) => sweep(b, (id) => byId.get(id).parents));
  [...bands].reverse().forEach((b) => sweep(b, (id) => children.get(id)));
}

function closure(start, next) {
  const seen = new Set(); const stack = [...next(start)];
  while (stack.length) { const x = stack.pop(); if (!seen.has(x)) { seen.add(x); stack.push(...next(x)); } }
  return seen;
}
const ancestorsOf = (id) => closure(id, (x) => byId.get(x).parents);
const descendantsOf = (id) => closure(id, (x) => children.get(x));

const state = { sel: null, q: "", status: new Set(STATUS), owners: new Set(DATA.owners) };

// --- drawing ---
const SVGNS = "http://www.w3.org/2000/svg";
const map = document.getElementById("map");
const tip = document.getElementById("tip");
const GUTTER = 112, BAND = 66, TOP = 18;
let geom = { W: 0, nodeEls: new Map(), edgeEls: [] };

function el(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function glyph(status, r) {
  const s = document.createElementNS(SVGNS, "svg");
  s.setAttribute("viewBox", "-6 -6 12 12");
  const g = el("g", { class: `node ${status}` }, s);
  el("circle", { class: "mark", r }, g);
  if (status === "proposed") el("circle", { class: "core", r: r * 0.42 }, g);
  return s;
}

function draw() {
  const W = Math.max(map.clientWidth, 760);
  const H = TOP + LEVELS.length * BAND;
  map.textContent = "";
  const svg = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": "Decision map: one band per level, links from each node to what it follows from" }, map);
  const x = (id) => GUTTER + pos.get(id) * (W - GUTTER - 18);
  const y = (id) => TOP + LEVELS.indexOf(byId.get(id).level) * BAND + BAND / 2;

  LEVELS.forEach((l, i) => {
    const yy = TOP + i * BAND;
    if (i % 2 === 0) el("rect", { x: 0, y: yy, width: W, height: BAND, fill: "var(--band)" }, svg);
    const t = el("text", { x: 14, y: yy + BAND / 2 - 2, class: "band-label" }, svg); t.textContent = LEVEL_NAMES[l];
    const c = el("text", { x: 14, y: yy + BAND / 2 + 13, class: "band-count" }, svg); c.textContent = bands[i].length;
  });

  const eg = el("g", {}, svg);
  geom.edgeEls = edges.map(([p, c]) => {
    const x1 = x(p), y1 = y(p), x2 = x(c), y2 = y(c);
    let d;
    if (y1 === y2) { const lift = Math.min(26, 8 + Math.abs(x2 - x1) * 0.15); d = `M${x1},${y1} C${x1},${y1 - lift} ${x2},${y2 - lift} ${x2},${y2}`; }
    else { const m = (y1 + y2) / 2; d = `M${x1},${y1} C${x1},${m} ${x2},${m} ${x2},${y2}`; }
    return { p, c, e: el("path", { d, class: "edge" }, eg) };
  });

  const ng = el("g", {}, svg);
  geom.nodeEls = new Map();
  for (const n of DATA.nodes) {
    const g = el("g", { class: `node ${n.status}`, transform: `translate(${x(n.id)},${y(n.id)})` }, ng);
    el("circle", { class: "halo", r: 9 }, g);
    el("circle", { class: "mark", r: 4.6 }, g);
    if (n.status === "proposed") el("circle", { class: "core", r: 1.9 }, g);
    g.addEventListener("click", () => select(n.id));
    g.addEventListener("mouseenter", (ev) => showTip(n, ev));
    g.addEventListener("mousemove", (ev) => moveTip(ev));
    g.addEventListener("mouseleave", () => { tip.hidden = true; });
    geom.nodeEls.set(n.id, g);
  }
  geom.label = el("text", { class: "sel-label", "text-anchor": "middle" }, svg);
  geom.x = x; geom.y = y; geom.W = W;
  paint();
}

function showTip(n, ev) {
  tip.textContent = "";
  const b = document.createElement("b"); b.textContent = n.id;
  tip.append(b, ` · ${STATUS_NAMES[n.status]} · ${n.owner}`, document.createElement("br"), n.title);
  tip.hidden = false; moveTip(ev);
}
function moveTip(ev) {
  const w = tip.offsetWidth;
  tip.style.left = `${Math.min(ev.clientX + 14, window.innerWidth - w - 12)}px`;
  tip.style.top = `${ev.clientY + 16}px`;
}

function matches(n) {
  if (!state.status.has(n.status) || !state.owners.has(n.owner)) return false;
  if (!state.q) return true;
  return (n.id + " " + n.title).toLowerCase().includes(state.q);
}

function paint() {
  let lit = null, anc = null, desc = null;
  if (state.sel) {
    anc = ancestorsOf(state.sel); desc = descendantsOf(state.sel);
    lit = new Set([state.sel, ...anc, ...desc]);
  }
  for (const n of DATA.nodes) {
    const g = geom.nodeEls.get(n.id);
    const ok = matches(n) && (!lit || lit.has(n.id));
    g.classList.toggle("off", !ok);
    g.classList.toggle("hit", !!state.q && matches(n));
    g.classList.toggle("sel", n.id === state.sel);
  }
  for (const { p, c, e } of geom.edgeEls) {
    let on = false;
    if (state.sel) {
      const up = anc.has(p) && (c === state.sel || anc.has(c));
      const down = desc.has(c) && (p === state.sel || desc.has(p));
      on = up || down;
    }
    const visible = matches(byId.get(p)) && matches(byId.get(c));
    e.classList.toggle("on", on && visible);
    e.classList.toggle("off", (state.sel && !on) || !visible);
  }
  if (state.sel) {
    geom.label.textContent = state.sel;
    geom.label.setAttribute("x", Math.min(Math.max(geom.x(state.sel), GUTTER + 20), geom.W - 40));
    geom.label.setAttribute("y", geom.y(state.sel) - 13);
  } else geom.label.textContent = "";
  renderPanel(anc, desc);
}

// --- panel ---
const panel = document.getElementById("panel");
function h(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function listOf(ids, title) {
  const wrap = h("div");
  const head = h("h3", null, title); head.append(h("span", null, String(ids.size))); wrap.append(head);
  if (!ids.size) { wrap.append(h("p", "hint", "Nothing.")); return wrap; }
  for (const l of LEVELS) {
    const inLevel = [...ids].filter((i) => byId.get(i).level === l).sort(natural);
    if (!inLevel.length) continue;
    const g = h("div", "group"); g.append(h("div", "lvl", `${LEVEL_NAMES[l]} · ${inLevel.length}`));
    const LIMIT = 6;
    const add = (list) => list.forEach((i) => {
      const n = byId.get(i);
      const b = h("button", "item"); b.type = "button";
      b.append(glyph(n.status, 4.6), h("span", "nid", n.id), h("span", "t", n.title));
      b.title = n.title; b.addEventListener("click", () => select(i));
      g.append(b);
    });
    add(inLevel.slice(0, LIMIT));
    if (inLevel.length > LIMIT) {
      const more = h("button", "more", `Show ${inLevel.length - LIMIT} more`); more.type = "button";
      more.addEventListener("click", () => { more.remove(); add(inLevel.slice(LIMIT)); });
      g.append(more);
    }
    wrap.append(g);
  }
  return wrap;
}

function stanceNotes(n) {
  const out = [];
  if (n.decided) out.push(["Decided", `${n.decided.answer || n.decided.option || ""} (${n.decided.by}, ${n.decided.date})`]);
  if (n.one_way) out.push(["One-way door", n.one_way]);
  for (const a of n.assumes || []) out.push([`Bets on ${a.node}`, `${a.answer}. If wrong: ${a.if_wrong}`]);
  if (n.robust_to && n.robust_to.length) out.push(["Works whatever is decided on", n.robust_to.join(", ")]);
  if (n.deferred) out.push(["Deferred", typeof n.deferred === "string" ? n.deferred : JSON.stringify(n.deferred)]);
  if (n.options && n.status === "open") out.push(["Options", n.options.map((o) => o.label).join(" / ")]);
  if (n.notes) out.push(["Notes", n.notes]);
  return out;
}

function renderPanel(anc, desc) {
  panel.textContent = "";
  if (!state.sel) {
    panel.append(h("div", "eyebrow", "Overview"));
    panel.append(h("p", "hint", `${DATA.nodes.length} nodes and ${edges.length} links. Click a node, search, or pick one below.`));
    const s = h("div", "summary");
    LEVELS.forEach((l, i) => {
      const row = h("div", "srow"); row.append(h("span", null, LEVEL_NAMES[l]));
      const bar = h("div", "bar");
      for (const st of STATUS) {
        const k = bands[i].filter((id) => byId.get(id).status === st).length;
        const seg = h("i"); seg.style.width = `${(100 * k) / Math.max(bands[i].length, 1)}%`;
        seg.style.background = st === "decided" ? "var(--ink)" : st === "proposed" ? "var(--edge)" : "var(--open)";
        seg.title = `${k} ${st}`; bar.append(seg);
      }
      row.append(bar, h("span", "n", String(bands[i].length)));
      s.append(row);
    });
    panel.append(s, legend());
    const open = new Set(DATA.nodes.filter((n) => n.status === "open" && n.owner !== "patrick").map((n) => n.id));
    panel.append(listOf(open, "Open, owned by others"));
    return;
  }
  const n = byId.get(state.sel);
  const top = h("div", "eyebrow", LEVEL_NAMES[n.level]);
  panel.append(top, h("div", "nid", n.id), h("div", "title", n.title));
  const dl = h("dl", "meta");
  const pill = h("span", "pill"); pill.append(glyph(n.status, 4.6), STATUS_NAMES[n.status]);
  const rows = [["Status", pill], ["Owner", n.owner], ["Source", n.source]];
  if (n.branch) rows.push(["Branch", n.branch]);
  for (const [k, v] of rows) { dl.append(h("dt", null, k)); const dd = h("dd"); dd.append(v); dl.append(dd); }
  panel.append(dl);
  for (const [k, v] of stanceNotes(n)) { const p = h("p", "note"); p.append(h("span", "k", `${k}: `), v); panel.append(p); }
  panel.append(listOf(anc, "Rests on"), listOf(desc, "Leads to"));
  const clear = h("button", "more", "Back to the overview"); clear.type = "button";
  clear.addEventListener("click", () => select(null)); panel.append(clear);
}

function legend() {
  const lg = h("div", "legend");
  for (const st of STATUS) { const s = h("span"); s.append(glyph(st, 4.6), STATUS_NAMES[st]); lg.append(s); }
  return lg;
}

function select(id) { state.sel = id; paint(); }

// --- controls ---
const statusChips = document.getElementById("status-chips");
for (const st of STATUS) {
  const b = h("button", "chip"); b.type = "button"; b.setAttribute("aria-pressed", "true");
  b.append(glyph(st, 4.6), STATUS_NAMES[st]);
  b.addEventListener("click", () => {
    state.status.has(st) ? state.status.delete(st) : state.status.add(st);
    b.setAttribute("aria-pressed", String(state.status.has(st))); paint();
  });
  statusChips.append(b);
}
const ownerChips = document.getElementById("owner-chips");
for (const o of DATA.owners) {
  const b = h("button", "chip", o); b.type = "button"; b.setAttribute("aria-pressed", "true");
  b.addEventListener("click", () => {
    state.owners.has(o) ? state.owners.delete(o) : state.owners.add(o);
    b.setAttribute("aria-pressed", String(state.owners.has(o))); paint();
  });
  ownerChips.append(b);
}
const q = document.getElementById("q");
q.addEventListener("input", () => { state.q = q.value.trim().toLowerCase(); paint(); });
q.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter") { const first = DATA.nodes.find((n) => state.q && matches(n)); if (first) select(first.id); }
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") { q.value = ""; state.q = ""; select(null); } });

let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(draw, 120); });
const start = decodeURIComponent(location.hash.slice(1));
state.sel = byId.has(start) ? start : (byId.has(DATA.start) ? DATA.start : null);
draw();
</script>

</body>
</html>
